# Three-Tier Composite Backend Configuration Example
# This configuration demonstrates a production-ready setup with:
# - L1: Memory (ultra-fast, limited capacity)
# - L2: Redis (distributed, moderate speed)
# - L3: PostgreSQL (persistent, supports vector search)

server:
  address: ":8080"
  
cache:
  type: "composite"
  min_similarity: 0.85  # Threshold for semantic similarity matching
  
  composite:
    promote_on_hit: true  # Automatically promote frequently accessed data
    
    tiers:
      # L1: Memory - Ultra-fast access for hot data
      - name: "memory-l1"
        type: "memory"
        priority: 1  # Highest priority (checked first)
        capacity: 1000
        eviction_policy: "LRU"
        
      # L2: Redis - Distributed cache for warm data
      - name: "redis-l2"
        type: "redis"
        priority: 2
        redis:
          addrs:
            - "localhost:6379"
          password: ""  # Set if Redis requires authentication
          
      # L3: PostgreSQL - Persistent storage with vector search
      - name: "postgres-l3"
        type: "gorm"
        priority: 3
        # Requires DATABASE_URL environment variable

# OpenAI configuration for embeddings
openai:
  api_key: "${OPENAI_API_KEY}"
  base_url: "https://api.openai.com/v1"

# Database URL for PostgreSQL tier
# Export: DATABASE_URL="postgres://user:pass@localhost/cache?sslmode=disable"