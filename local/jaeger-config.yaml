# Jaeger configuration for semantic cache observability
# This configuration sets up Jaeger with in-memory storage for development
# For production, consider using Elasticsearch or Cassandra as storage backend

# Receivers configuration
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  
  zipkin:
    endpoint: 0.0.0.0:9411
  
  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_http:
        endpoint: 0.0.0.0:14268
      thrift_compact:
        endpoint: 0.0.0.0:6831
      thrift_binary:
        endpoint: 0.0.0.0:6832

# Processors configuration
processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048
  
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 25

# Extensions configuration
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  
  zpages:
    endpoint: 0.0.0.0:55679

# Storage configuration
storage:
  type: memory
  memory:
    max_traces: 100000

# Service configuration
service:
  extensions: [health_check, zpages]
  pipelines:
    traces:
      receivers: [otlp, zipkin, jaeger]
      processors: [memory_limiter, batch]
      exporters: [jaeger_storage]

# Exporters configuration
exporters:
  jaeger_storage:
    endpoint: localhost:14250
    tls:
      insecure: true

# Query service configuration
query:
  http:
    endpoint: 0.0.0.0:16686
  grpc:
    endpoint: 0.0.0.0:16685
  max_clock_skew_adjustment: 30s

# Sampling configuration
sampling:
  default_strategy:
    type: probabilistic
    param: 1.0  # Sample 100% of traces in development
  
  # Service-specific sampling strategies
  service_strategies:
    - service: "semantic-cache"
      type: probabilistic
      param: 1.0
    - service: "cache-api"
      type: probabilistic
      param: 0.5

# Processor specific configurations
processor:
  # Adaptive sampling processor
  adaptive_sampling:
    max_traces_per_second: 100
    target_samples_per_second: 10
    
  # Span metrics processor
  span_metrics:
    dimensions:
      - name: http.method
      - name: http.status_code
      - name: db.operation
    aggregation_temporality: DELTA
    metrics_exporter: prometheus

# Agent configuration (for Jaeger agent mode)
agent:
  reporter:
    grpc:
      host-port: localhost:14250
      retry:
        max_elapsed_time: 120s
  processor:
    jaeger-compact:
      server-host-port: 0.0.0.0:6831
    jaeger-binary:
      server-host-port: 0.0.0.0:6832

# Collector configuration
collector:
  num_workers: 10
  queue_size: 2000
  
# UI Configuration
ui:
  config_file: ""
  log_level: info
  # Additional UI specific configs
  dependencies:
    menu_enabled: true
  archive:
    enabled: false
  metrics_backend: prometheus
  
# Prometheus metrics
metrics:
  backend: prometheus
  http_route: /metrics
  
# Logging configuration
log_level: info