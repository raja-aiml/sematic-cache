# Full Observability Stack for Semantic Cache
# PostgreSQL with pgvector, Redis, OTel Collector, Jaeger, and Prometheus

services:
  # PostgreSQL with pgvector for vector similarity search
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: cache-postgres
    environment:
      POSTGRES_USER: cache_user
      POSTGRES_PASSWORD: cache_pass
      POSTGRES_DB: semantic_cache
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cache_user -d semantic_cache"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cache-net

  # Redis for L2 cache tier
  redis:
    image: redis:7-alpine
    container_name: cache-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cache-net

  # OpenTelemetry Collector - Central telemetry hub
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.97.0
    container_name: ${COMPOSE_PROJECT_NAME:-semantic}-otel-collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
      - "8888:8888"    # Prometheus metrics exposed by the collector
      - "8889:8889"    # Prometheus exporter metrics endpoint
      - "13133:13133"  # Health check endpoint
      - "55679:55679"  # ZPages endpoint
    depends_on:
      - jaeger
      - prometheus
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cache-net

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: ${COMPOSE_PROJECT_NAME:-semantic}-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - QUERY_BASE_PATH=/jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # gRPC for model.proto
      - "4317"        # OTLP gRPC (internal)
      - "4318"        # OTLP HTTP (internal)
    healthcheck:
      test: ["CMD", "wget", "--spider", "localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cache-net

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: ${COMPOSE_PROJECT_NAME:-semantic}-prometheus
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.external-url=http://localhost/prometheus/'
      - '--web.route-prefix=/prometheus/'
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "localhost:9090"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cache-net

  # Caddy - Web server and reverse proxy
  caddy:
    image: caddy:2-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-semantic}-caddy
    ports:
      - "80:80"       # Main web interface
      - "443:443"     # HTTPS (with auto-cert)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./dashboard.html:/srv/dashboard.html
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - jaeger
      - prometheus
      - otel-collector
    healthcheck:
      test: ["CMD", "wget", "--spider", "localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cache-net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  caddy_data:
  caddy_config:

networks:
  cache-net:
    driver: bridge