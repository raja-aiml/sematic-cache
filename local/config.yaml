# Example configuration for Semantic Cache with OTel Collector

# Cache configuration
cache:
  # Storage backend type: redis, postgres, memory
  backend: postgres
  
  # TTL for cache entries
  ttl: 3600  # 1 hour in seconds
  
  # Maximum cache size (entries)
  max_size: 10000
  
  # Similarity threshold for semantic matching
  similarity_threshold: 0.85

# PostgreSQL configuration
postgres:
  host: localhost
  port: 5432
  database: semantic_cache
  username: cache_user
  password: cache_pass
  ssl_mode: disable
  max_connections: 25
  max_idle_connections: 5

# Redis configuration  
redis:
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 10

# OpenAI configuration
openai:
  api_key: ${OPENAI_API_KEY}  # Set via environment variable
  model: text-embedding-ada-002
  max_retries: 3
  timeout: 30s

# Server configuration
server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  
  # CORS settings
  cors:
    enabled: true
    allowed_origins:
      - "http://localhost:3000"
      - "http://localhost:8080"
    allowed_methods:
      - GET
      - POST
      - PUT
      - DELETE
    allowed_headers:
      - Content-Type
      - Authorization

# Observability configuration
observability:
  # OpenTelemetry configuration
  otel:
    enabled: true
    service_name: semantic-cache
    # Point to OTel Collector instead of directly to Jaeger
    endpoint: localhost:4317  # OTel Collector gRPC endpoint
    insecure: true  # Use insecure connection for development
    
    # Sampling configuration
    sampling:
      # Sampling strategy: always, never, probabilistic, rate_limiting
      strategy: probabilistic
      # Probability for probabilistic sampling (0.0 to 1.0)
      probability: 1.0  # 100% sampling for development
    
    # Resource attributes
    attributes:
      environment: development
      version: 1.0.0
      team: platform
  
  # Metrics configuration
  metrics:
    enabled: true
    # Prometheus metrics endpoint
    endpoint: /metrics
    port: 8080  # Same as main server port
    
    # Custom metrics
    custom_metrics:
      - name: cache_hits_total
        type: counter
        description: Total number of cache hits
      - name: cache_misses_total
        type: counter
        description: Total number of cache misses
      - name: embedding_generation_duration
        type: histogram
        description: Time taken to generate embeddings
      - name: query_duration
        type: histogram
        description: Time taken to process queries
  
  # Logging configuration
  logging:
    level: info  # debug, info, warn, error
    format: json  # json or text
    output: stdout  # stdout, stderr, or file path
    
    # Structured logging fields
    fields:
      service: semantic-cache
      environment: development

# Feature flags
features:
  # Enable/disable semantic search
  semantic_search: true
  
  # Enable/disable exact match caching
  exact_match: true
  
  # Enable/disable compression
  compression: true
  
  # Enable/disable rate limiting
  rate_limiting:
    enabled: true
    requests_per_minute: 100
    burst: 20

# Health check configuration
health:
  # Liveness probe endpoint
  liveness_endpoint: /health/live
  
  # Readiness probe endpoint
  readiness_endpoint: /health/ready
  
  # Startup probe endpoint
  startup_endpoint: /health/startup
  
  # Check intervals
  check_interval: 10s
  timeout: 5s