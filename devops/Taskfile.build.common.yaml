# Common Build Task definitions for Go projects
# Usage: 
#   includes:
#     build: ./devops/Taskfile.build.common.yaml
#
# Then use: task build:build, task build:test, etc.

version: '3'

vars:
  # Version info
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  BUILD_TIME:
    sh: date -u '+%Y-%m-%d_%H:%M:%S'
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  GIT_BRANCH:
    sh: git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "unknown"
  
  # Platform detection
  OS:
    sh: |
      case "$(uname -s)" in
        Linux*) echo "linux";;
        Darwin*) echo "darwin";;
        CYGWIN*|MINGW*|MSYS*) echo "windows";;
        *) echo "unknown";;
      esac
  ARCH:
    sh: |
      case "$(uname -m)" in
        x86_64|amd64) echo "amd64";;
        arm64|aarch64) echo "arm64";;
        i386|i686) echo "386";;
        *) echo "unknown";;
      esac
  
  # Go settings
  GOCMD: go
  GOBUILD: "{{.GOCMD}} build"
  GOCLEAN: "{{.GOCMD}} clean"
  GOTEST: "{{.GOCMD}} test"
  GOGET: "{{.GOCMD}} get"
  GOMOD: "{{.GOCMD}} mod"
  GOFMT: gofmt
  GOVET: "{{.GOCMD}} vet"
  
  # Default settings
  BINARY_DIR: "{{.BINARY_DIR | default \"bin\"}}"
  COVERAGE_DIR: "{{.COVERAGE_DIR | default \"coverage\"}}"
  
  # Build flags
  DEFAULT_LDFLAGS: -s -w -X main.version={{.VERSION}} -X main.buildTime={{.BUILD_TIME}} -X main.gitCommit={{.GIT_COMMIT}}
  LDFLAGS: ""  # Additional ldflags can be passed

tasks:
  # === BUILD TASKS ===
  build:
    desc: Build binary for current platform
    vars:
      BINARY_NAME: '{{.BINARY_NAME | default (base .PWD)}}'
      OUTPUT: '{{.OUTPUT | default (print .BINARY_DIR "/" .BINARY_NAME)}}'
    cmds:
      - mkdir -p {{.BINARY_DIR}}
      - |
        echo "🔨 Building {{.BINARY_NAME}}..."
        {{.GOBUILD}} -ldflags "{{.DEFAULT_LDFLAGS}} {{.LDFLAGS}}" -o {{.OUTPUT}} {{.MAIN | default "."}}
      - |
        if [ -f {{.OUTPUT}} ]; then
          echo "✅ Built: {{.OUTPUT}} ($(du -h {{.OUTPUT}} | cut -f1))"
        fi
    env:
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'
      GOOS: '{{.GOOS | default .OS}}'
      GOARCH: '{{.GOARCH | default .ARCH}}'

  build:all:
    desc: Build for all major platforms
    vars:
      BINARY_NAME: '{{.BINARY_NAME | default (base .PWD)}}'
    cmds:
      - task: build:multi
        vars:
          PLATFORMS: "linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64"

  build:multi:
    desc: Build for multiple platforms
    vars:
      BINARY_NAME: '{{.BINARY_NAME | default (base .PWD)}}'
      PLATFORMS: '{{.PLATFORMS | default "linux/amd64 darwin/amd64"}}'
    cmds:
      - |
        echo "🔨 Building for multiple platforms..."
        for platform in {{.PLATFORMS}}; do
          os=${platform%/*}
          arch=${platform#*/}
          output="{{.BINARY_DIR}}/{{.BINARY_NAME}}-${os}-${arch}"
          if [ "$os" = "windows" ]; then
            output="${output}.exe"
          fi
          echo "  → Building $platform..."
          GOOS=$os GOARCH=$arch {{.GOBUILD}} -ldflags "{{.DEFAULT_LDFLAGS}} {{.LDFLAGS}}" -o "$output" {{.MAIN | default "."}}
          echo "  ✓ Built: $output ($(du -h "$output" | cut -f1))"
        done

  # === CLEAN TASKS ===
  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BINARY_DIR}}
      - rm -rf {{.COVERAGE_DIR}}
      - rm -f coverage.out coverage.html
      - '{{.GOCLEAN}} {{.CLEAN_FLAGS | default "-cache -testcache"}}'
      - echo "🧹 Cleaned build artifacts"

  clean:all:
    desc: Deep clean including dependencies
    cmds:
      - task: clean
      - '{{.GOCLEAN}} -modcache'
      - echo "🧹 Deep clean completed"

  # === TEST TASKS ===
  test:
    desc: Run tests
    cmds:
      - '{{.GOTEST}} -race -v {{.TEST_ARGS}} {{.PACKAGES | default "./..."}}'

  test:short:
    desc: Run short tests
    cmds:
      - task: test
        vars:
          TEST_ARGS: "-short {{.TEST_ARGS}}"

  test:coverage:
    desc: Run tests with coverage
    cmds:
      - mkdir -p {{.COVERAGE_DIR}}
      - |
        {{.GOTEST}} -race -coverprofile={{.COVERAGE_DIR}}/coverage.out -covermode=atomic {{.PACKAGES | default "./..."}}
        {{.GOCMD}} tool cover -html={{.COVERAGE_DIR}}/coverage.out -o {{.COVERAGE_DIR}}/coverage.html
        echo "📊 Coverage report: {{.COVERAGE_DIR}}/coverage.html"
        {{.GOCMD}} tool cover -func={{.COVERAGE_DIR}}/coverage.out | tail -1

  test:bench:
    desc: Run benchmarks
    cmds:
      - '{{.GOTEST}} -bench=. -benchmem {{.BENCH_ARGS}} {{.PACKAGES | default "./..."}}'

  # === CODE QUALITY TASKS ===
  fmt:
    desc: Format code
    cmds:
      - '{{.GOFMT}} -w {{.FMT_ARGS}} .'
      - echo "✨ Code formatted"

  fmt:check:
    desc: Check code formatting
    cmds:
      - |
        if [ -n "$({{.GOFMT}} -l .)" ]; then
          echo "❌ Code is not formatted. Run 'task fmt'"
          {{.GOFMT}} -d .
          exit 1
        fi
        echo "✅ Code is properly formatted"

  vet:
    desc: Run go vet
    cmds:
      - '{{.GOVET}} {{.VET_ARGS}} {{.PACKAGES | default "./..."}}'
      - echo "✅ No vet issues found"

  lint:
    desc: Run linting (requires golangci-lint)
    cmds:
      - |
        if command -v golangci-lint >/dev/null 2>&1; then
          golangci-lint run {{.LINT_ARGS}} {{.PACKAGES | default "./..."}}
          echo "✅ No lint issues found"
        else
          echo "⚠️  golangci-lint not installed, skipping..."
        fi

  # === DEPENDENCY TASKS ===
  deps:
    desc: Download dependencies
    cmds:
      - '{{.GOMOD}} download'
      - echo "📦 Dependencies downloaded"

  deps:update:
    desc: Update dependencies
    cmds:
      - '{{.GOGET}} -u {{.UPDATE_ARGS}} {{.PACKAGES | default "./..."}}'
      - '{{.GOMOD}} tidy'
      - echo "📦 Dependencies updated"

  deps:tidy:
    desc: Tidy dependencies
    cmds:
      - '{{.GOMOD}} tidy'
      - echo "📦 Dependencies tidied"

  # === DOCKER TASKS ===
  docker:build:
    desc: Build Docker image
    vars:
      IMAGE_NAME: '{{.IMAGE_NAME | default (base .PWD)}}'
      IMAGE_TAG: '{{.IMAGE_TAG | default .VERSION}}'
    cmds:
      - |
        echo "🐳 Building Docker image {{.IMAGE_NAME}}:{{.IMAGE_TAG}}..."
        docker build -t {{.IMAGE_NAME}}:{{.IMAGE_TAG}} {{.DOCKER_BUILD_ARGS}} .
        docker tag {{.IMAGE_NAME}}:{{.IMAGE_TAG}} {{.IMAGE_NAME}}:latest
        echo "✅ Docker image built: {{.IMAGE_NAME}}:{{.IMAGE_TAG}}"

  docker:push:
    desc: Push Docker image
    vars:
      IMAGE_NAME: '{{.IMAGE_NAME | default (base .PWD)}}'
      IMAGE_TAG: '{{.IMAGE_TAG | default .VERSION}}'
    cmds:
      - docker push {{.IMAGE_NAME}}:{{.IMAGE_TAG}}
      - docker push {{.IMAGE_NAME}}:latest
      - 'echo "✅ Docker image pushed: {{.IMAGE_NAME}}:{{.IMAGE_TAG}}"'

  # === UTILITY TASKS ===
  info:
    desc: Show build information
    cmds:
      - |
        echo "📋 Build Information"
        echo "==================="
        echo "Directory: {{.PWD}}"
        echo "Version: {{.VERSION}}"
        echo "Build Time: {{.BUILD_TIME}}"
        echo "Git Commit: {{.GIT_COMMIT}}"
        echo "Git Branch: {{.GIT_BRANCH}}"
        echo "Platform: {{.OS}}/{{.ARCH}}"
        echo "Go Version: $({{.GOCMD}} version)"

  check:
    desc: Run all checks (fmt, vet, lint, test)
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: test:short

  ci:
    desc: Run CI pipeline
    cmds:
      - task: deps
      - task: check
      - task: build
      - task: test:coverage

  release:
    desc: Create release artifacts
    deps: [clean]
    cmds:
      - task: test
      - task: build:all
      - |
        echo "📦 Creating release {{.VERSION}}..."
        mkdir -p releases/{{.VERSION}}
        cp {{.BINARY_DIR}}/* releases/{{.VERSION}}/
        cd releases && tar -czf {{.BINARY_NAME}}-{{.VERSION}}.tar.gz {{.VERSION}}