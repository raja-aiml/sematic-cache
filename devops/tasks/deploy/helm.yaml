# Helm Chart Management Tasks
# Focused on Helm chart operations
#
# Usage:
#   includes:
#     helm: ./devops/tasks/deploy/helm.yaml
#
# Then use: task helm:install, helm:upgrade, etc.

version: '3'

vars:
  RELEASE_NAME: '{{.RELEASE_NAME | default .APP_NAME | default "app"}}'
  NAMESPACE: '{{.NAMESPACE | default "default"}}'
  CHART_PATH: '{{.CHART_PATH | default "./chart"}}'
  VALUES_FILE: '{{.VALUES_FILE | default "values.yaml"}}'
  HELM_TIMEOUT: '{{.HELM_TIMEOUT | default "5m"}}'

tasks:
  install:
    desc: Install Helm chart
    deps: [lint]
    cmds:
      - |
        echo "📦 Installing Helm chart {{.RELEASE_NAME}}..."
        helm install {{.RELEASE_NAME}} {{.CHART_PATH}} \
          -n {{.NAMESPACE}} --create-namespace \
          -f {{.VALUES_FILE}} \
          --timeout {{.HELM_TIMEOUT}} \
          --wait \
          {{.HELM_ARGS}}
        echo "✅ Chart installed"

  upgrade:
    desc: Upgrade Helm release
    deps: [lint]
    cmds:
      - |
        echo "⬆️  Upgrading Helm release {{.RELEASE_NAME}}..."
        helm upgrade {{.RELEASE_NAME}} {{.CHART_PATH}} \
          -n {{.NAMESPACE}} \
          -f {{.VALUES_FILE}} \
          --timeout {{.HELM_TIMEOUT}} \
          --wait \
          {{.HELM_ARGS}}
        echo "✅ Release upgraded"

  install-or-upgrade:
    desc: Install or upgrade Helm release
    deps: [lint]
    cmds:
      - |
        echo "📦 Installing or upgrading {{.RELEASE_NAME}}..."
        helm upgrade --install {{.RELEASE_NAME}} {{.CHART_PATH}} \
          -n {{.NAMESPACE}} --create-namespace \
          -f {{.VALUES_FILE}} \
          --timeout {{.HELM_TIMEOUT}} \
          --wait \
          {{.HELM_ARGS}}
        echo "✅ Release ready"

  uninstall:
    desc: Uninstall Helm release
    cmds:
      - |
        echo "🗑️  Uninstalling Helm release {{.RELEASE_NAME}}..."
        helm uninstall {{.RELEASE_NAME}} -n {{.NAMESPACE}}
        echo "✅ Release uninstalled"

  rollback:
    desc: Rollback Helm release
    vars:
      REVISION: '{{.REVISION | default "0"}}'
    cmds:
      - |
        echo "↩️  Rolling back {{.RELEASE_NAME}} to revision {{.REVISION}}..."
        helm rollback {{.RELEASE_NAME}} {{.REVISION}} -n {{.NAMESPACE}} --wait
        echo "✅ Rollback completed"

  status:
    desc: Show Helm release status
    cmds:
      - echo "📊 Status of {{.RELEASE_NAME}}:"
      - helm status {{.RELEASE_NAME}} -n {{.NAMESPACE}}

  list:
    desc: List Helm releases
    cmds:
      - echo "📋 Helm releases in namespace {{.NAMESPACE}}:"
      - helm list -n {{.NAMESPACE}}

  list:all:
    desc: List all Helm releases
    cmds:
      - echo "📋 All Helm releases:"
      - helm list -A

  history:
    desc: Show Helm release history
    cmds:
      - echo "📜 History of {{.RELEASE_NAME}}:"
      - helm history {{.RELEASE_NAME}} -n {{.NAMESPACE}}

  values:
    desc: Show computed values
    cmds:
      - echo "⚙️  Computed values for {{.RELEASE_NAME}}:"
      - helm get values {{.RELEASE_NAME}} -n {{.NAMESPACE}}

  values:all:
    desc: Show all values (including defaults)
    cmds:
      - echo "⚙️  All values for {{.RELEASE_NAME}}:"
      - helm get values {{.RELEASE_NAME}} -n {{.NAMESPACE}} --all

  manifest:
    desc: Show rendered manifest
    cmds:
      - echo "📄 Rendered manifest for {{.RELEASE_NAME}}:"
      - helm get manifest {{.RELEASE_NAME}} -n {{.NAMESPACE}}

  notes:
    desc: Show release notes
    cmds:
      - echo "📝 Notes for {{.RELEASE_NAME}}:"
      - helm get notes {{.RELEASE_NAME}} -n {{.NAMESPACE}}

  lint:
    desc: Lint Helm chart
    cmds:
      - |
        echo "🔍 Linting Helm chart..."
        helm lint {{.CHART_PATH}} -f {{.VALUES_FILE}}
        echo "✅ Chart is valid"

  template:
    desc: Render chart templates locally
    cmds:
      - |
        echo "📄 Rendering templates..."
        helm template {{.RELEASE_NAME}} {{.CHART_PATH}} \
          -n {{.NAMESPACE}} \
          -f {{.VALUES_FILE}} \
          {{.HELM_ARGS}}

  dry-run:
    desc: Dry run installation
    cmds:
      - |
        echo "🔍 Dry run installation..."
        helm install {{.RELEASE_NAME}} {{.CHART_PATH}} \
          -n {{.NAMESPACE}} \
          -f {{.VALUES_FILE}} \
          --dry-run --debug \
          {{.HELM_ARGS}}

  package:
    desc: Package Helm chart
    cmds:
      - |
        echo "📦 Packaging Helm chart..."
        helm package {{.CHART_PATH}} {{.PACKAGE_ARGS}}
        echo "✅ Chart packaged"

  dependency:update:
    desc: Update chart dependencies
    cmds:
      - |
        echo "📥 Updating chart dependencies..."
        helm dependency update {{.CHART_PATH}}
        echo "✅ Dependencies updated"

  dependency:build:
    desc: Build chart dependencies
    cmds:
      - |
        echo "🔨 Building chart dependencies..."
        helm dependency build {{.CHART_PATH}}
        echo "✅ Dependencies built"

  test:
    desc: Run Helm tests
    cmds:
      - |
        echo "🧪 Running Helm tests for {{.RELEASE_NAME}}..."
        helm test {{.RELEASE_NAME}} -n {{.NAMESPACE}}

  repo:add:
    desc: Add Helm repository
    vars:
      REPO_NAME: '{{.REPO_NAME}}'
      REPO_URL: '{{.REPO_URL}}'
    cmds:
      - |
        echo "➕ Adding Helm repository {{.REPO_NAME}}..."
        helm repo add {{.REPO_NAME}} {{.REPO_URL}}
        helm repo update
        echo "✅ Repository added"

  repo:update:
    desc: Update Helm repositories
    cmds:
      - |
        echo "🔄 Updating Helm repositories..."
        helm repo update
        echo "✅ Repositories updated"

  repo:list:
    desc: List Helm repositories
    cmds:
      - echo "📋 Helm repositories:"
      - helm repo list

  search:
    desc: Search for Helm charts
    vars:
      KEYWORD: '{{.KEYWORD | default ""}}'
    cmds:
      - echo "🔍 Searching for charts matching '{{.KEYWORD}}':"
      - helm search repo {{.KEYWORD}}

  clean:
    desc: Clean up Helm resources
    cmds:
      - |
        echo "🧹 Cleaning up Helm resources..."
        rm -f {{.CHART_PATH}}/charts/*.tgz
        rm -f {{.CHART_PATH}}/Chart.lock
        echo "✅ Cleaned up"