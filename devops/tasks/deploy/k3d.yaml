# k3d Cluster Management Tasks
# Focused on local Kubernetes cluster operations
#
# Usage:
#   includes:
#     k3d: ./devops/tasks/deploy/k3d.yaml
#
# Then use: task k3d:create, task k3d:delete, etc.

version: '3'

vars:
  CLUSTER_NAME: '{{.CLUSTER_NAME | default "dev-cluster"}}'
  K3S_VERSION: '{{.K3S_VERSION | default "v1.28.3-k3s1"}}'
  AGENTS: '{{.AGENTS | default "0"}}'
  SERVERS: '{{.SERVERS | default "1"}}'
  API_PORT: '{{.API_PORT | default "6443"}}'
  LB_PORT: '{{.LB_PORT | default "8080"}}'
  
  # Registry settings
  REGISTRY_NAME: '{{.REGISTRY_NAME | default "k3d-registry.localhost"}}'
  REGISTRY_PORT: '{{.REGISTRY_PORT | default "5000"}}'
  USE_REGISTRY: '{{.USE_REGISTRY | default "false"}}'

tasks:
  create:
    desc: Create k3d cluster
    cmds:
      - |
        echo "🏗️  Creating k3d cluster {{.CLUSTER_NAME}}..."
        k3d cluster create {{.CLUSTER_NAME}} \
          --image rancher/k3s:{{.K3S_VERSION}} \
          --servers {{.SERVERS}} \
          --agents {{.AGENTS}} \
          --api-port {{.API_PORT}} \
          --port "{{.LB_PORT}}:80@loadbalancer" \
          {{if eq .USE_REGISTRY "true"}}--registry-use {{.REGISTRY_NAME}}:{{.REGISTRY_PORT}}{{end}} \
          {{.CLUSTER_ARGS}}
        echo "✅ Cluster {{.CLUSTER_NAME}} created"

  create:with-registry:
    desc: Create k3d cluster with local registry
    cmds:
      - task: registry:create
      - task: create
        vars:
          USE_REGISTRY: "true"

  delete:
    desc: Delete k3d cluster
    cmds:
      - |
        echo "🗑️  Deleting cluster {{.CLUSTER_NAME}}..."
        k3d cluster delete {{.CLUSTER_NAME}}
        echo "✅ Cluster {{.CLUSTER_NAME}} deleted"

  start:
    desc: Start k3d cluster
    cmds:
      - |
        echo "▶️  Starting cluster {{.CLUSTER_NAME}}..."
        k3d cluster start {{.CLUSTER_NAME}}
        echo "✅ Cluster {{.CLUSTER_NAME}} started"

  stop:
    desc: Stop k3d cluster
    cmds:
      - |
        echo "⏹️  Stopping cluster {{.CLUSTER_NAME}}..."
        k3d cluster stop {{.CLUSTER_NAME}}
        echo "✅ Cluster {{.CLUSTER_NAME}} stopped"

  restart:
    desc: Restart k3d cluster
    deps: [stop]
    cmds:
      - task: start

  list:
    desc: List k3d clusters
    cmds:
      - echo "📋 k3d clusters:"
      - k3d cluster list

  info:
    desc: Show cluster information
    cmds:
      - echo "ℹ️  Cluster {{.CLUSTER_NAME}} information:"
      - k3d cluster list | grep {{.CLUSTER_NAME}} || echo "Cluster not found"
      - echo ""
      - kubectl cluster-info
      - echo ""
      - kubectl get nodes

  kubeconfig:
    desc: Get kubeconfig for cluster
    cmds:
      - k3d kubeconfig get {{.CLUSTER_NAME}}

  kubeconfig:merge:
    desc: Merge cluster kubeconfig into default
    cmds:
      - |
        echo "📝 Merging kubeconfig for {{.CLUSTER_NAME}}..."
        k3d kubeconfig merge {{.CLUSTER_NAME}} --merge-default-kubeconfig
        echo "✅ Kubeconfig merged"

  registry:create:
    desc: Create local Docker registry
    cmds:
      - |
        echo "🐳 Creating local registry {{.REGISTRY_NAME}}:{{.REGISTRY_PORT}}..."
        k3d registry create {{.REGISTRY_NAME}} --port {{.REGISTRY_PORT}}
        echo "✅ Registry created at {{.REGISTRY_NAME}}:{{.REGISTRY_PORT}}"

  registry:delete:
    desc: Delete local Docker registry
    cmds:
      - |
        echo "🗑️  Deleting registry {{.REGISTRY_NAME}}..."
        k3d registry delete {{.REGISTRY_NAME}}
        echo "✅ Registry deleted"

  registry:list:
    desc: List k3d registries
    cmds:
      - echo "📋 k3d registries:"
      - k3d registry list

  node:add:
    desc: Add node to cluster
    vars:
      NODE_TYPE: '{{.NODE_TYPE | default "agent"}}'
    cmds:
      - |
        echo "➕ Adding {{.NODE_TYPE}} node to {{.CLUSTER_NAME}}..."
        k3d node create new-{{.NODE_TYPE}} --cluster {{.CLUSTER_NAME}} --role {{.NODE_TYPE}}
        echo "✅ Node added"

  node:delete:
    desc: Delete node from cluster
    vars:
      NODE_NAME: '{{.NODE_NAME}}'
    cmds:
      - |
        echo "➖ Deleting node {{.NODE_NAME}}..."
        k3d node delete {{.NODE_NAME}}
        echo "✅ Node deleted"

  node:list:
    desc: List cluster nodes
    cmds:
      - echo "📋 Nodes in {{.CLUSTER_NAME}}:"
      - k3d node list | grep {{.CLUSTER_NAME}}

  image:import:
    desc: Import image into k3d cluster
    vars:
      IMAGE: '{{.IMAGE}}'
    cmds:
      - |
        echo "📦 Importing image {{.IMAGE}} into {{.CLUSTER_NAME}}..."
        k3d image import {{.IMAGE}} --cluster {{.CLUSTER_NAME}}
        echo "✅ Image imported"

  image:import-all:
    desc: Import all local images matching pattern
    vars:
      PATTERN: '{{.PATTERN | default "*:latest"}}'
    cmds:
      - |
        echo "📦 Importing images matching {{.PATTERN}}..."
        for image in $(docker images --format "{{.Repository}}:{{.Tag}}" | grep "{{.PATTERN}}"); do
          echo "  → Importing $image"
          k3d image import $image --cluster {{.CLUSTER_NAME}}
        done
        echo "✅ Images imported"

  exec:
    desc: Execute command in cluster node
    vars:
      NODE: '{{.NODE | default (print "k3d-" .CLUSTER_NAME "-server-0")}}'
      CMD: '{{.CMD | default "sh"}}'
    cmds:
      - docker exec -it {{.NODE}} {{.CMD}}

  logs:
    desc: Show k3d cluster logs
    vars:
      NODE: '{{.NODE | default (print "k3d-" .CLUSTER_NAME "-server-0")}}'
    cmds:
      - docker logs {{.LOG_ARGS}} {{.NODE}}