# Compatibility wrapper for old build tasks
# This file maps old task names to new modular tasks
# DEPRECATED: Please migrate to new structure

version: '3'

includes:
  go_internal: ./tasks/build/go.yaml
  docker_internal: ./tasks/build/docker.yaml

tasks:
  _deprecation_notice:
    cmds:
      - 'echo "⚠️  WARNING: Using deprecated task structure. Please migrate to new modular tasks."'
      - 'echo "📖 See devops/docs/migration.md for migration guide"'
    silent: true

  # === BUILD TASKS ===
  build:
    desc: "[DEPRECATED] Use go:build"
    deps: [_deprecation_notice]
    cmds:
      - task: go_internal:build

  build:all:
    desc: "[DEPRECATED] Use go:build:all"
    deps: [_deprecation_notice]
    cmds:
      - task: go_internal:build:all

  build:multi:
    desc: "[DEPRECATED] Use go:build:linux, go:build:darwin, etc"
    deps: [_deprecation_notice]
    cmds:
      - task: go_internal:build:all

  # === CLEAN TASKS ===
  clean:
    desc: "[DEPRECATED] Use go:clean"
    deps: [_deprecation_notice]
    cmds:
      - task: go_internal:clean

  clean:all:
    desc: "[DEPRECATED] Use go:clean"
    deps: [_deprecation_notice]
    cmds:
      - task: go_internal:clean

  # === TEST TASKS ===
  test:
    desc: "[DEPRECATED] Use go:test"
    deps: [_deprecation_notice]
    cmds:
      - task: go_internal:test

  test:short:
    desc: "[DEPRECATED] Use go:test:short"
    deps: [_deprecation_notice]
    cmds:
      - task: go_internal:test:short

  test:coverage:
    desc: "[DEPRECATED] Use go:test:coverage"
    deps: [_deprecation_notice]
    cmds:
      - task: go_internal:test:coverage

  test:bench:
    desc: "[DEPRECATED] Use go:test:bench"
    deps: [_deprecation_notice]
    cmds:
      - task: go_internal:test:bench

  # === CODE QUALITY TASKS ===
  fmt:
    desc: "[DEPRECATED] Use go:fmt"
    deps: [_deprecation_notice]
    cmds:
      - task: go_internal:fmt

  fmt:check:
    desc: "[DEPRECATED] Use go:fmt:check"
    deps: [_deprecation_notice]
    cmds:
      - task: go_internal:fmt:check

  vet:
    desc: "[DEPRECATED] Use go:vet"
    deps: [_deprecation_notice]
    cmds:
      - task: go_internal:vet

  lint:
    desc: "[DEPRECATED] Use go:lint"
    deps: [_deprecation_notice]
    cmds:
      - task: go_internal:lint

  # === DEPENDENCY TASKS ===
  deps:
    desc: "[DEPRECATED] Use go:mod:download"
    deps: [_deprecation_notice]
    cmds:
      - task: go_internal:mod:download

  deps:update:
    desc: "[DEPRECATED] Use go:mod:update"
    deps: [_deprecation_notice]
    cmds:
      - task: go_internal:mod:update

  deps:tidy:
    desc: "[DEPRECATED] Use go:mod:tidy"
    deps: [_deprecation_notice]
    cmds:
      - task: go_internal:mod:tidy

  # === DOCKER TASKS ===
  docker:build:
    desc: "[DEPRECATED] Use docker:build"
    deps: [_deprecation_notice]
    cmds:
      - task: docker_internal:build

  docker:push:
    desc: "[DEPRECATED] Use docker:push"
    deps: [_deprecation_notice]
    cmds:
      - task: docker_internal:push

  # === UTILITY TASKS ===
  info:
    desc: "[DEPRECATED] Use go:info"
    deps: [_deprecation_notice]
    cmds:
      - task: go_internal:info

  check:
    desc: "[DEPRECATED] Use individual quality tasks"
    deps: [_deprecation_notice]
    cmds:
      - task: go_internal:fmt:check
      - task: go_internal:vet
      - task: go_internal:lint
      - task: go_internal:test:short

  ci:
    desc: "[DEPRECATED] Create custom CI workflow"
    deps: [_deprecation_notice]
    cmds:
      - task: go_internal:mod:download
      - task: check
      - task: go_internal:build
      - task: go_internal:test:coverage

  release:
    desc: "[DEPRECATED] Create custom release workflow"
    deps: [_deprecation_notice]
    cmds:
      - task: go_internal:test
      - task: go_internal:build:all