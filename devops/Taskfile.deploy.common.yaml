# Common deployment task definitions for Kubernetes/Docker projects
# Usage: 
#   includes:
#     deploy: ./devops/Taskfile.deploy.common.yaml
#
# Then use: task deploy:setup, task deploy:deploy, etc.

version: '3'

vars:
  # Default deployment settings
  CLUSTER_NAME: '{{.CLUSTER_NAME | default "semantic-cache"}}'
  API_URL: '{{.API_URL | default "http://localhost:8080/semantic-cache"}}'
  WEB_URL: '{{.WEB_URL | default "http://localhost:8080/web"}}'
  WORKFLOW_SCRIPT: '{{.WORKFLOW_SCRIPT | default "./workflow.sh"}}'
  
  # Kubernetes settings
  APP_NAMESPACE: '{{.APP_NAMESPACE | default "app"}}'
  INFRA_NAMESPACE: '{{.INFRA_NAMESPACE | default "infra"}}'
  
  # Timeouts
  DEPLOY_TIMEOUT: '{{.DEPLOY_TIMEOUT | default "5m"}}'
  HEALTH_TIMEOUT: '{{.HEALTH_TIMEOUT | default "2m"}}'

env:
  FORCE_COLOR: true

tasks:
  # === CORE DEPLOYMENT WORKFLOWS ===
  full:
    desc: Complete production workflow (setup → build → deploy → test)
    cmds:
      - echo "🚀 Running complete production workflow..."
      - "{{.WORKFLOW_SCRIPT}} full"

  quick:
    desc: Quick development workflow with essential tests only
    cmds:
      - echo "⚡ Running quick development workflow..."
      - "{{.WORKFLOW_SCRIPT}} --quick full"

  reset:
    desc: Complete reset (cleanup → setup → build → deploy)
    cmds:
      - echo "🔄 Resetting entire deployment..."
      - "{{.WORKFLOW_SCRIPT}} reset"

  # === INDIVIDUAL DEPLOYMENT STEPS ===
  setup:
    desc: Create cluster and deploy infrastructure
    cmds:
      - echo "🏗️  Setting up cluster and infrastructure..."
      - "{{.WORKFLOW_SCRIPT}} setup"

  deploy:
    desc: Deploy application to cluster
    cmds:
      - echo "🚀 Deploying application..."
      - "{{.WORKFLOW_SCRIPT}} deploy"

  # === CLUSTER MANAGEMENT ===
  cluster:create:
    desc: Create cluster
    cmds:
      - echo "🏗️  Creating cluster {{.CLUSTER_NAME}}..."
      - k3d cluster create {{.CLUSTER_NAME}} {{.CLUSTER_ARGS}}

  cluster:delete:
    desc: Delete cluster
    cmds:
      - echo "🗑️  Deleting cluster {{.CLUSTER_NAME}}..."
      - k3d cluster delete {{.CLUSTER_NAME}}

  cluster:start:
    desc: Start cluster
    cmds:
      - echo "▶️  Starting cluster {{.CLUSTER_NAME}}..."
      - k3d cluster start {{.CLUSTER_NAME}}

  cluster:stop:
    desc: Stop cluster
    cmds:
      - echo "⏹️  Stopping cluster {{.CLUSTER_NAME}}..."
      - k3d cluster stop {{.CLUSTER_NAME}}

  cluster:info:
    desc: Show cluster information
    cmds:
      - 'echo "🏗️  Cluster Information:"'
      - k3d cluster list
      - echo ""
      - kubectl cluster-info
      - echo ""
      - kubectl get nodes

  cluster:events:
    desc: Show recent cluster events
    cmds:
      - 'echo "📅 Recent Cluster Events:"'
      - kubectl get events --all-namespaces --sort-by='.lastTimestamp' | tail -20

  # === TESTING ===
  test:
    desc: Run comprehensive end-to-end tests
    cmds:
      - echo "🧪 Running comprehensive tests..."
      - "{{.WORKFLOW_SCRIPT}} test"

  test:quick:
    desc: Run essential tests only (faster)
    cmds:
      - echo "⚡ Running quick tests..."
      - "{{.WORKFLOW_SCRIPT}} quick-test"

  test:api:
    desc: Test API endpoints with sample data
    cmds:
      - echo "🔬 Testing API endpoints..."
      - 'echo "Testing health endpoint:"'
      - curl -s {{.API_URL}}/health
      - echo ""
      - 'echo "Testing cache SET:"'
      - |
        curl -s -X POST {{.API_URL}}/set \
          -H "Content-Type: application/json" \
          -d '{"prompt":"What is Kubernetes?","answer":"Container orchestration platform","modelName":"test"}'
      - echo ""
      - 'echo "Testing cache GET:"'
      - |
        curl -s -X POST {{.API_URL}}/get \
          -H "Content-Type: application/json" \
          -d '{"prompt":"What is Kubernetes?"}'

  test:benchmark:
    desc: Run API performance benchmark
    cmds:
      - echo "⚡ Running API performance benchmark..."
      - echo "Making 50 concurrent requests to test performance..."
      - |
        seq 1 50 | xargs -P 10 -I {} curl -s -w "%{time_total}s\\n" -o /dev/null {{.API_URL}}/health | sort -n | tail -10

  test:smoke:
    desc: Run smoke tests
    cmds:
      - echo "🚬 Running smoke tests..."
      - curl -s --max-time 5 {{.API_URL}}/health >/dev/null && echo "✅ API responding" || echo "❌ API not responding"
      - curl -s --max-time 5 {{.WEB_URL}}/ >/dev/null && echo "✅ Web responding" || echo "❌ Web not responding"

  # === MONITORING & MAINTENANCE ===
  status:
    desc: Show current deployment status
    cmds:
      - echo "📊 Checking deployment status..."
      - "{{.WORKFLOW_SCRIPT}} status"

  logs:
    desc: Show application logs
    cmds:
      - echo "📜 Showing application logs..."
      - "{{.WORKFLOW_SCRIPT}} logs"

  logs:follow:
    desc: Follow application logs in real-time
    cmds:
      - echo "📜 Following logs..."
      - kubectl logs -n {{.APP_NAMESPACE}} -l app=sematic-cache -f

  health:
    desc: Quick health check of all services
    cmds:
      - echo "❤️  Performing health check..."
      - 'echo "API Health:"'
      - curl -s {{.API_URL}}/health | jq . || echo "❌ API not responding"
      - echo ""
      - 'echo "Web Interface:"'
      - curl -s {{.WEB_URL}}/ | head -1 || echo "❌ Web not responding"

  metrics:
    desc: Show API metrics
    cmds:
      - 'echo "📈 API Metrics:"'
      - curl -s {{.API_URL}}/metrics | jq . || echo "❌ Metrics not available"

  # === KUBERNETES OPERATIONS ===
  k8s:pods:
    desc: Show pod status
    cmds:
      - kubectl get pods -A -o wide

  k8s:services:
    desc: Show service status
    cmds:
      - kubectl get svc -A

  k8s:ingress:
    desc: Show ingress status
    cmds:
      - kubectl get ingress -A

  k8s:namespaces:
    desc: Show namespace status
    cmds:
      - kubectl get namespaces

  k8s:describe:pods:
    desc: Describe pods in app namespace
    cmds:
      - kubectl describe pods -n {{.APP_NAMESPACE}}

  k8s:describe:services:
    desc: Describe services in app namespace
    cmds:
      - kubectl describe svc -n {{.APP_NAMESPACE}}

  # === SCALING ===
  scale:up:
    desc: Scale application to 2 replicas
    cmds:
      - echo "📈 Scaling application up..."
      - kubectl scale deployment sematic-cache --replicas=2 -n {{.APP_NAMESPACE}}
      - echo "Waiting for scaling to complete..."
      - kubectl rollout status deployment/sematic-cache -n {{.APP_NAMESPACE}}

  scale:down:
    desc: Scale application to 1 replica
    cmds:
      - echo "📉 Scaling application down..."
      - kubectl scale deployment sematic-cache --replicas=1 -n {{.APP_NAMESPACE}}
      - echo "Waiting for scaling to complete..."
      - kubectl rollout status deployment/sematic-cache -n {{.APP_NAMESPACE}}

  scale:custom:
    desc: Scale application to custom replica count
    cmds:
      - echo "📊 Scaling application to {{.REPLICAS}} replicas..."
      - kubectl scale deployment sematic-cache --replicas={{.REPLICAS}} -n {{.APP_NAMESPACE}}
      - kubectl rollout status deployment/sematic-cache -n {{.APP_NAMESPACE}}

  # === RESTART & ROLLOUT ===
  restart:
    desc: Restart application deployment
    cmds:
      - echo "🔄 Restarting application..."
      - kubectl rollout restart deployment/sematic-cache -n {{.APP_NAMESPACE}}
      - kubectl rollout status deployment/sematic-cache -n {{.APP_NAMESPACE}}

  rollout:status:
    desc: Check rollout status
    cmds:
      - kubectl rollout status deployment/sematic-cache -n {{.APP_NAMESPACE}}

  rollout:history:
    desc: Show rollout history
    cmds:
      - kubectl rollout history deployment/sematic-cache -n {{.APP_NAMESPACE}}

  rollout:undo:
    desc: Undo last rollout
    cmds:
      - echo "↩️  Rolling back deployment..."
      - kubectl rollout undo deployment/sematic-cache -n {{.APP_NAMESPACE}}
      - kubectl rollout status deployment/sematic-cache -n {{.APP_NAMESPACE}}

  # === PORT FORWARDING ===
  port-forward:api:
    desc: Port forward to API service (localhost:8080)
    cmds:
      - echo "🔗 Port forwarding to API service..."
      - kubectl port-forward -n {{.APP_NAMESPACE}} svc/sematic-cache 8080:8080

  port-forward:postgres:
    desc: Port forward to PostgreSQL (localhost:5432)
    cmds:
      - echo "🔗 Port forwarding to PostgreSQL..."
      - kubectl port-forward -n {{.INFRA_NAMESPACE}} svc/postgres 5432:5432

  port-forward:redis:
    desc: Port forward to Redis (localhost:6379)
    cmds:
      - echo "🔗 Port forwarding to Redis..."
      - kubectl port-forward -n {{.INFRA_NAMESPACE}} svc/redis 6379:6379

  # === VERIFICATION ===
  verify:
    desc: Verify deployment is working correctly
    cmds:
      - echo "✅ Verifying deployment..."
      - 'echo "Checking cluster:"'
      - k3d cluster list | grep {{.CLUSTER_NAME}} && echo "✅ Cluster exists" || echo "❌ Cluster missing"
      - 'echo "Checking pods:"'
      - kubectl get pods -A | grep -E "(Running|Ready)" && echo "✅ Pods running" || echo "❌ Pod issues"
      - 'echo "Checking API:"'
      - curl -s --max-time 5 {{.API_URL}}/health >/dev/null && echo "✅ API responding" || echo "❌ API not responding"
      - 'echo "Checking web:"'
      - curl -s --max-time 5 {{.WEB_URL}}/ >/dev/null && echo "✅ Web responding" || echo "❌ Web not responding"

  validate:
    desc: Validate configuration files
    cmds:
      - echo "✅ Validating configuration..."
      - kubectl kustomize . >/dev/null && echo "✅ Root kustomization valid" || echo "❌ Root kustomization invalid"
      - kubectl kustomize app/ >/dev/null && echo "✅ App kustomization valid" || echo "❌ App kustomization invalid"
      - kubectl kustomize infra/ >/dev/null && echo "✅ Infra kustomization valid" || echo "❌ Infra kustomization invalid"

  # === CLEANUP ===
  cleanup:
    desc: Destroy cluster and cleanup all resources
    cmds:
      - echo "🧹 Cleaning up all resources..."
      - "{{.WORKFLOW_SCRIPT}} cleanup"

  cleanup:force:
    desc: Force cleanup (delete cluster and all resources)
    cmds:
      - echo "🧹 Force cleaning up all resources..."
      - k3d cluster delete {{.CLUSTER_NAME}} || true
      - docker system prune -f || true
      - echo "✅ Force cleanup completed"

  # === DEVELOPMENT HELPERS ===
  dev:
    desc: Development cycle (build → deploy → quick-test)
    cmds:
      - echo "🔧 Running development cycle..."
      - "{{.WORKFLOW_SCRIPT}} build deploy quick-test"

  redeploy:
    desc: Quick redeploy (build → deploy)
    cmds:
      - echo "🔄 Redeploying application..."
      - "{{.WORKFLOW_SCRIPT}} build deploy"

  # === DEBUGGING ===
  debug:
    desc: Debug deployment issues
    cmds:
      - 'echo "🐛 Debug Information:"'
      - echo "=== Cluster Status ==="
      - k3d cluster list
      - echo ""
      - echo "=== Pod Status ==="
      - kubectl get pods -A -o wide
      - echo ""
      - echo "=== Service Status ==="
      - kubectl get svc -A
      - echo ""
      - echo "=== Recent Events ==="
      - kubectl get events --all-namespaces --sort-by='.lastTimestamp' | tail -10
      - echo ""
      - echo "=== API Status ==="
      - curl -I {{.API_URL}}/health 2>/dev/null || echo "API not accessible"

  debug:pods:
    desc: Debug pod issues
    cmds:
      - 'echo "🔍 Pod Debug Information:"'
      - echo "=== Pod Status ==="
      - kubectl get pods -A -o wide
      - echo ""
      - echo "=== Pod Descriptions ==="
      - kubectl describe pods -n {{.APP_NAMESPACE}}
      - echo ""
      - echo "=== Pod Logs ==="
      - 'echo "Sematic Cache logs:"'
      - kubectl logs -n {{.APP_NAMESPACE}} -l app=sematic-cache --tail=20
      - echo ""
      - 'echo "Web service logs:"'
      - kubectl logs -n {{.APP_NAMESPACE}} -l app=web --tail=20

  debug:network:
    desc: Debug network connectivity issues
    cmds:
      - 'echo "🌐 Network Debug Information:"'
      - echo "=== Services ==="
      - kubectl get svc -A
      - echo ""
      - echo "=== Endpoints ==="
      - kubectl get endpoints -A
      - echo ""
      - echo "=== Ingress ==="
      - kubectl get ingress -A
      - echo ""
      - echo "=== External Connectivity ==="
      - 'echo "Testing API:"'
      - curl -I {{.API_URL}}/health 2>/dev/null || echo "API not accessible"
      - 'echo "Testing Web:"'
      - curl -I {{.WEB_URL}}/ 2>/dev/null || echo "Web not accessible"

  # === RESOURCE MANAGEMENT ===
  resources:
    desc: Show resource usage across cluster
    cmds:
      - 'echo "📊 Resource Usage:"'
      - kubectl top nodes 2>/dev/null || echo "Metrics server not available"
      - echo ""
      - kubectl top pods -A 2>/dev/null || echo "Pod metrics not available"

  resources:limits:
    desc: Show resource limits and requests
    cmds:
      - 'echo "📊 Resource Limits and Requests:"'
      - kubectl describe pods -n {{.APP_NAMESPACE}} | grep -A 5 -E "(Limits|Requests)"

  # === CI/CD HELPERS ===
  ci:test:
    desc: Run CI-friendly tests (no interactive prompts)
    cmds:
      - echo "🤖 Running CI tests..."
      - "{{.WORKFLOW_SCRIPT}} --quick --skip-cleanup full"

  ci:validate:
    desc: Validate all configurations for CI
    cmds:
      - task: validate
      - echo "Running quick smoke test..."
      - task: test:smoke