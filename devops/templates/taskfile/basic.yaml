# Basic Taskfile Template
# Copy this file to your project root and customize

version: '3'

includes:
  go: ./devops/tasks/build/go.yaml
  docker: ./devops/tasks/build/docker.yaml

vars:
  APP_NAME: '{{.APP_NAME | default (base .USER_WORKING_DIR)}}'
  VERSION: '{{.VERSION | default "dev"}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build application
    cmds:
      - task: go:build
        vars:
          BINARY_NAME: '{{.APP_NAME}}'

  test:
    desc: Run tests
    cmds:
      - task: go:test

  docker:
    desc: Build Docker image
    cmds:
      - task: docker:build
        vars:
          IMAGE_NAME: '{{.APP_NAME}}'
          IMAGE_TAG: '{{.VERSION}}'

  run:
    desc: Run application locally
    deps: [build]
    cmds:
      - ./bin/{{.APP_NAME}}

  clean:
    desc: Clean build artifacts
    cmds:
      - task: go:clean
      - task: docker:clean

  fmt:
    desc: Format code
    cmds:
      - task: go:fmt

  lint:
    desc: Run linters
    cmds:
      - task: go:lint

  ci:
    desc: Run CI checks
    cmds:
      - task: fmt
      - task: lint
      - task: test
      - task: build