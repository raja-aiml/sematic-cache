version: '3'

includes:
  # Include common build tasks
  build:
    taskfile: ./devops/Taskfile.build.common.yaml
    dir: '{{.USER_WORKING_DIR}}'
  
  # Include common deploy tasks
  deploy:
    taskfile: ./devops/Taskfile.deploy.common.yaml
    dir: '{{.USER_WORKING_DIR}}'
    
  # Include IaaC orchestration
  iaac-ops:
    taskfile: ./iaac/blueprint/Taskfile.yaml
    dir: ./iaac/blueprint/archive

vars:
  IAAC_DIR: ./iaac
  DEVOPS_DIR: ./devops

tasks:
  default:
    desc: Show available tasks for Semantic Cache project
    cmds:
      - |
        echo "🚀 Semantic Cache - Root Task Runner"
        echo "===================================="
        echo ""
        echo "🎯 Quick Commands:"
        echo "  task full          # Complete production workflow"
        echo "  task quick         # Quick development workflow"
        echo "  task build         # Build application"
        echo "  task test          # Run tests"
        echo "  task deploy        # Deploy to cluster"
        echo ""
        echo "🔧 Development Commands:"
        echo "  task dev           # Development cycle"
        echo "  task status        # Check deployment status"
        echo "  task logs          # View logs"
        echo "  task health        # Health checks"
        echo ""
        echo "🧪 Testing Commands:"
        echo "  task test:coverage # Test with coverage"
        echo "  task test:api      # Test API endpoints"
        echo "  task verify        # Verify deployment"
        echo ""
        echo "🐛 Debug & Cleanup:"
        echo "  task debug         # Debug deployment"
        echo "  task cleanup       # Clean up resources"
        echo ""
        echo "📚 For all tasks: task --list"
    silent: true

  # === BUILD TASKS ===
  build:
    desc: Build the semantic cache server
    cmds:
      - task: build:build
        vars:
          BINARY_NAME: semantic-cache
          MAIN: ./cmd/server

  build:all:
    desc: Build for all platforms
    cmds:
      - task: build:build:all
        vars:
          BINARY_NAME: semantic-cache
          MAIN: ./cmd/server

  build:iaac:
    desc: Build the IaaC deployment tool
    cmds:
      - cd ./iaac/infra && task build

  # === TEST TASKS ===
  test:
    desc: Run all tests in the project
    cmds:
      - task: build:test

  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - task: build:test:coverage

  test:bench:
    desc: Run benchmarks
    cmds:
      - task: build:test:bench

  # === CODE QUALITY TASKS ===
  fmt:
    desc: Format all Go code
    cmds:
      - task: build:fmt

  lint:
    desc: Run linting
    cmds:
      - task: build:lint

  check:
    desc: Run all checks (fmt, vet, lint, test)
    cmds:
      - task: build:check

  # === CLEAN TASKS ===
  clean:
    desc: Clean all build artifacts
    cmds:
      - task: build:clean
      - cd ./iaac/infra && task clean

  # === CORE WORKFLOWS ===
  full:
    desc: Complete production workflow (setup → build → deploy → test)
    cmds:
      - task: deploy:full

  quick:
    desc: Quick development workflow with essential tests
    cmds:
      - task: deploy:quick

  reset:
    desc: Complete reset (cleanup → setup → build → deploy)
    cmds:
      - task: deploy:reset

  # === DOCKER TASKS ===
  docker:build:
    desc: Build Docker image
    cmds:
      - task: build:docker:build
        vars:
          IMAGE_NAME: semantic-cache

  docker:push:
    desc: Push Docker image
    cmds:
      - task: build:docker:push
        vars:
          IMAGE_NAME: semantic-cache

  # === DEPLOYMENT TASKS ===
  setup:
    desc: Create k3d cluster and deploy infrastructure
    cmds:
      - task: deploy:setup

  deploy:
    desc: Deploy application to cluster
    cmds:
      - task: deploy:deploy

  # === MONITORING TASKS ===
  status:
    desc: Show current deployment status
    cmds:
      - task: deploy:status

  logs:
    desc: Show application logs
    cmds:
      - task: deploy:logs

  health:
    desc: Quick health check of all services
    cmds:
      - task: deploy:health

  metrics:
    desc: Show API metrics
    cmds:
      - task: deploy:metrics

  # === DEVELOPMENT TASKS ===
  dev:
    desc: Development cycle (build → deploy → quick-test)
    cmds:
      - task: build
      - task: deploy:dev

  # === CI/CD TASKS ===
  ci:
    desc: Run CI pipeline
    cmds:
      - task: build:ci

  release:
    desc: Create release artifacts
    cmds:
      - task: build:release
        vars:
          BINARY_NAME: semantic-cache
          MAIN: ./cmd/server

  # === TESTING TASKS ===
  test:api:
    desc: Test API endpoints
    cmds:
      - task: deploy:test:api

  test:benchmark:
    desc: Run API performance benchmark
    cmds:
      - task: deploy:test:benchmark

  # === DEBUGGING TASKS ===
  debug:
    desc: Debug deployment issues
    cmds:
      - task: deploy:debug

  debug:pods:
    desc: Debug pod issues
    cmds:
      - task: deploy:debug:pods

  debug:network:
    desc: Debug network connectivity
    cmds:
      - task: deploy:debug:network

  # === SCALING TASKS ===
  scale:up:
    desc: Scale application to 2 replicas
    cmds:
      - task: deploy:scale:up

  scale:down:
    desc: Scale application to 1 replica
    cmds:
      - task: deploy:scale:down

  # === VERIFICATION TASKS ===
  verify:
    desc: Verify deployment is working correctly
    cmds:
      - task: deploy:verify

  validate:
    desc: Validate configuration files
    cmds:
      - task: deploy:validate

  # === CLEANUP TASKS ===
  cleanup:
    desc: Destroy cluster and cleanup all resources
    cmds:
      - task: deploy:cleanup

  cleanup:all:
    desc: Clean everything including build artifacts
    cmds:
      - task: cleanup
      - task: clean

  # === PORT FORWARDING TASKS ===
  port-forward:api:
    desc: Port forward to API service (localhost:8080)
    cmds:
      - task: deploy:port-forward:api

  port-forward:postgres:
    desc: Port forward to PostgreSQL (localhost:5432)
    cmds:
      - task: deploy:port-forward:postgres

  port-forward:redis:
    desc: Port forward to Redis (localhost:6379)
    cmds:
      - task: deploy:port-forward:redis

  # === UTILITY TASKS ===
  deps:
    desc: Download and tidy dependencies
    cmds:
      - task: build:deps
      - task: build:deps:tidy

  info:
    desc: Show project and build information
    cmds:
      - task: build:info
      - |
        echo ""
        echo "📦 Semantic Cache Project Info:"
        echo "IaaC Directory: {{.IAAC_DIR}}"
        echo "DevOps Directory: {{.DEVOPS_DIR}}"

  docs:
    desc: Show project documentation
    cmds:
      - |
        echo "📚 Semantic Cache Documentation:"
        echo "Main README: ./README.md"
        echo "IaaC README: ./iaac/README.md"
        echo "DevOps README: ./devops/README.md"
        echo ""
        echo "Quick links:"
        echo "  API: http://localhost:8080/semantic-cache/"
        echo "  Web: http://localhost:8080/web/"
        echo ""
        echo "Common commands:"
        echo "  task full      # Complete workflow"
        echo "  task status    # Check status"
        echo "  task logs      # View logs"
        echo ""
        echo "For detailed task documentation:"
        echo "  task docs:generate  # Generate complete documentation"
        echo "  task docs:flow      # Show task dependencies"

  docs:generate:
    desc: Generate complete Taskfile documentation
    deps: [build:devops]
    cmds:
      - ./bin/devops taskdoc --output taskfile-docs.md
      - 'echo "📄 Documentation generated: taskfile-docs.md"'

  build:devops:
    desc: Build the devops CLI tool
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
      GIT_COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
      BUILD_TIME:
        sh: date -u '+%Y-%m-%d_%H:%M:%S'
    cmds:
      - mkdir -p bin
      - |
        cd devops/tools && go build -ldflags "\
          -X github.com/raja-aiml/sematic-cache/devops/tools/internal/devops/cmd.Version={{.VERSION}} \
          -X github.com/raja-aiml/sematic-cache/devops/tools/internal/devops/cmd.GitCommit={{.GIT_COMMIT}} \
          -X github.com/raja-aiml/sematic-cache/devops/tools/internal/devops/cmd.BuildTime={{.BUILD_TIME}}" \
          -o ../../bin/devops ./cmd/devops
    sources:
      - devops/tools/cmd/devops/**/*.go
      - devops/tools/internal/devops/**/*.go
      - devops/tools/internal/taskdoc/**/*.go
    generates:
      - bin/devops

  docs:flow:
    desc: Show task dependencies and flow
    cmds:
      - |
        echo "🔀 Task Flow Overview"
        echo "===================="
        echo ""
        echo "Root Taskfile.yaml"
        echo "├── includes:"
        echo "│   ├── build: (Go build tasks)"
        echo "│   ├── deploy: (K8s deployment tasks)"
        echo "│   └── iaac-ops: (Infrastructure tasks)"
        echo "│"
        echo "├── High-level workflows:"
        echo "│   ├── full → setup → build → deploy → test"
        echo "│   ├── quick → build → deploy → quick-test"
        echo "│   └── dev → build → deploy:dev"
        echo "│"
        echo "└── Task categories:"
        echo "    ├── build:* - Compilation & packaging"
        echo "    ├── deploy:* - Kubernetes operations"
        echo "    ├── test:* - Testing & validation"
        echo "    ├── docker:* - Container operations"
        echo "    └── cleanup/clean - Resource cleanup"

  docs:tasks:
    desc: List all available tasks with descriptions
    cmds:
      - task --list-all

  docs:json:
    desc: Generate Taskfile documentation in JSON format
    deps: [build:devops]
    cmds:
      - ./bin/devops taskdoc --format json --output taskfile-docs.json
      - 'echo "📄 JSON documentation generated: taskfile-docs.json"'

  docs:flow:simple:
    desc: Show simple task flow (text only)
    deps: [build:devops]
    cmds:
      - ./bin/devops taskdoc --flow --output -