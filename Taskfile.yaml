version: '3'

includes:
  # Include common build tasks
  common:
    taskfile: ./build/Taskfile.common.yaml
    dir: '{{.USER_WORKING_DIR}}'
  
  # Include deploy tasks
  deploy:
    taskfile: ./deploy/Taskfile.yaml
    dir: ./deploy

vars:
  DEPLOY_DIR: ./deploy
  TEST_RUNNER: ./build/test.sh
  BUILD_DIR: ./build

tasks:
  default:
    desc: Show available tasks for Semantic Cache project
    cmds:
      - |
        echo "🚀 Semantic Cache - Root Task Runner"
        echo "===================================="
        echo ""
        echo "🎯 Quick Commands (from project root):"
        echo "  task full          # Complete production workflow"
        echo "  task quick         # Quick development workflow"
        echo "  task status        # Check deployment status"
        echo "  task test          # Run comprehensive tests"
        echo "  task cleanup       # Clean up resources"
        echo ""
        echo "🔧 Development Commands:"
        echo "  task dev           # Development cycle"
        echo "  task build         # Build application"
        echo "  task deploy        # Deploy to cluster"
        echo "  task logs          # View logs"
        echo ""
        echo "🧪 Testing Commands:"
        echo "  task test:api      # Test API endpoints"
        echo "  task test:perf     # Performance tests"
        echo "  task verify        # Verify deployment"
        echo ""
        echo "🐛 Debug Commands:"
        echo "  task debug         # Debug deployment"
        echo "  task health        # Health checks"
        echo "  task restart       # Restart services"
        echo ""
        echo "📚 For all available tasks: task --list"
        echo "📁 Deploy-specific tasks: task -d deploy --list"
    silent: true

  # Build Tasks (using common)
  build:
    desc: Build the semantic cache server
    cmds:
      - task: common:build
        vars:
          BINARY_NAME: semantic-cache
          MAIN: ./cmd/server

  build:all:
    desc: Build for all platforms
    cmds:
      - task: common:build:all
        vars:
          BINARY_NAME: semantic-cache
          MAIN: ./cmd/server

  build:local:
    desc: Build the local deployment tool
    cmds:
      - |
        cd ./deploy/local && \
        task build

  # Testing Tasks
  test:
    desc: Run all tests in the project
    cmds:
      - task: common:test

  test:local:
    desc: Run tests in deploy/local directory
    cmds:
      - task: common:test
        vars:
          DIR: ./deploy/local

  test:server:
    desc: Run tests in server directory
    cmds:
      - task: common:test
        vars:
          DIR: ./server

  test:core:
    desc: Run tests in core directory  
    cmds:
      - task: common:test
        vars:
          DIR: ./core

  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - task: common:test:coverage

  test:bench:
    desc: Run benchmarks
    cmds:
      - task: common:test:bench

  # Code Quality Tasks
  fmt:
    desc: Format all Go code
    cmds:
      - task: common:fmt

  lint:
    desc: Run linting
    cmds:
      - task: common:lint

  check:
    desc: Run all checks (fmt, vet, lint, test)
    cmds:
      - task: common:check

  # Clean Tasks
  clean:
    desc: Clean all build artifacts
    cmds:
      - task: common:clean
      - cd ./deploy/local && task clean

  # Core Workflows
  full:
    desc: Complete production workflow (setup → build → deploy → test)
    cmds:
      - task: deploy:full

  quick:
    desc: Quick development workflow with essential tests  
    cmds:
      - task: deploy:quick

  reset:
    desc: Complete reset (cleanup → setup → build → deploy)
    cmds:
      - task -d {{.DEPLOY_DIR}} reset

  # Docker Tasks
  docker:build:
    desc: Build Docker image
    cmds:
      - task: common:docker:build
        vars:
          IMAGE_NAME: semantic-cache

  docker:push:
    desc: Push Docker image
    cmds:
      - task: common:docker:push
        vars:
          IMAGE_NAME: semantic-cache

  # Deployment Tasks
  setup:
    desc: Create k3d cluster and deploy infrastructure
    cmds:
      - task: deploy:setup

  deploy:
    desc: Deploy application to cluster  
    cmds:
      - task: deploy:deploy

  verify:
    desc: Verify deployment
    cmds:
      - task: deploy:verify

  # Monitoring
  status:
    desc: Show current deployment status
    cmds:
      - task: deploy:status

  logs:
    desc: Show application logs
    cmds:
      - task: deploy:logs

  health:
    desc: Quick health check of all services  
    cmds:
      - task: deploy:health

  metrics:
    desc: Show API metrics
    cmds:
      - task: deploy:metrics

  # Development
  dev:
    desc: Development cycle (build → deploy → quick-test)
    cmds:
      - task: build
      - task: deploy:dev

  dev:watch:
    desc: Development with file watching
    cmds:
      - task: common:test
        vars:
          TEST_ARGS: "-w"

  # CI/CD Tasks
  ci:
    desc: Run CI pipeline
    cmds:
      - task: common:ci

  release:
    desc: Create release artifacts
    cmds:
      - task: common:release
        vars:
          BINARY_NAME: semantic-cache
          MAIN: ./cmd/server

  # Testing Suites
  test:api:
    desc: Test API endpoints only
    cmds:
      - task -d {{.DEPLOY_DIR}} test:api

  test:perf:
    desc: Test performance and load handling
    cmds:
      - task -d {{.DEPLOY_DIR}} test:performance

  test:infra:
    desc: Test infrastructure components only
    cmds:
      - task -d {{.DEPLOY_DIR}} test:infrastructure

  test:quick:
    desc: Run essential tests only (faster)
    cmds:
      - task -d {{.DEPLOY_DIR}} test:quick

  # Debugging
  debug:
    desc: Debug deployment issues
    cmds:
      - task -d {{.DEPLOY_DIR}} debug

  debug:pods:
    desc: Debug pod issues
    cmds:
      - task -d {{.DEPLOY_DIR}} debug:pods

  debug:network:
    desc: Debug network connectivity
    cmds:
      - task -d {{.DEPLOY_DIR}} debug:network

  # Scaling
  scale:up:
    desc: Scale application to 2 replicas
    cmds:
      - task -d {{.DEPLOY_DIR}} scale:up

  scale:down:
    desc: Scale application to 1 replica
    cmds:
      - task -d {{.DEPLOY_DIR}} scale:down

  # Verification
  verify:
    desc: Verify deployment is working correctly
    cmds:
      - task -d {{.DEPLOY_DIR}} verify

  validate:
    desc: Validate configuration files
    cmds:
      - task -d {{.DEPLOY_DIR}} validate

  # Cleanup
  cleanup:
    desc: Destroy cluster and cleanup all resources
    cmds:
      - task: deploy:cleanup

  cleanup:all:
    desc: Clean everything including build artifacts
    cmds:
      - task: cleanup
      - task: clean

  # Advanced Workflows
  production-ready:
    desc: Full production readiness validation
    cmds:
      - task -d {{.DEPLOY_DIR}} production-ready

  quick-start:
    desc: Quick start for new deployments
    cmds:
      - task -d {{.DEPLOY_DIR}} quick-start

  ci:test:
    desc: Run CI-friendly tests (no interactive prompts)
    cmds:
      - task -d {{.DEPLOY_DIR}} ci:test

  # Port Forwarding
  port-forward:api:
    desc: Port forward to API service (localhost:8080)
    cmds:
      - task -d {{.DEPLOY_DIR}} port-forward:api

  port-forward:postgres:
    desc: Port forward to PostgreSQL (localhost:5432)
    cmds:
      - task -d {{.DEPLOY_DIR}} port-forward:postgres

  # Utility Tasks
  deps:
    desc: Download and tidy dependencies
    cmds:
      - task: common:deps
      - task: common:deps:tidy

  info:
    desc: Show project and build information
    cmds:
      - task: common:info
      - |
        echo ""
        echo "📦 Semantic Cache Specific:"
        echo "Deploy Directory: {{.DEPLOY_DIR}}"
        echo "Build Directory: {{.BUILD_DIR}}"
        echo "Test Runner: {{.TEST_RUNNER}}"

  docs:
    desc: Show project documentation
    cmds:
      - |
        echo "📚 Semantic Cache Documentation:"
        echo "Main README: ./README.md"
        echo "Deploy README: ./deploy/README.md"
        echo "Test README: ./deploy/tests/README.md"
        echo ""
        echo "Quick links:"
        echo "  API: http://localhost:8080/semantic-cache/"
        echo "  Web: http://localhost:8080/web/"
        echo ""
        echo "Common commands:"
        echo "  task full      # Complete workflow"
        echo "  task status    # Check status"
        echo "  task logs      # View logs"

  # Install all tools
  install:tools:
    desc: Install all required tools
    cmds:
      - "{{.TEST_RUNNER}} --install-tools"
      - |
        echo "📦 Installing additional tools..."
        go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
        echo "✅ All tools installed"