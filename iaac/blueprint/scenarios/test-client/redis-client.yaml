apiVersion: v1
kind: Pod
metadata:
  name: redis-client
  labels:
    app: redis-client
spec:
  containers:
  - name: redis-client
    image: redis:7-alpine
    command: ["sleep", "3600"]
    env:
    - name: REDIS_HOST
      value: redis
    - name: REDIS_PORT
      value: "6379"
  restartPolicy: Never