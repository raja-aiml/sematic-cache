apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: monitoring-only-scenario

resources:
- ../../infra/modules/observability/prometheus
- ../../infra/modules/observability/grafana
- ../../infra/modules/observability/logging
- ../../infra/modules/observability/tracing

patchesStrategicMerge:
- values.yaml

namespace: monitoring

commonLabels:
  scenario: monitoring-only
  purpose: observability