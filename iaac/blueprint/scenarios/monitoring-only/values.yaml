apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-only-values
data:
  # Prometheus Configuration
  prometheus.retention: "15d"
  prometheus.storage.size: "20Gi"
  prometheus.scrapeInterval: "15s"
  prometheus.evaluationInterval: "15s"
  prometheus.resources.requests.cpu: "100m"
  prometheus.resources.requests.memory: "512Mi"
  prometheus.resources.limits.cpu: "1000m"
  prometheus.resources.limits.memory: "2Gi"
  
  # Alertmanager Configuration
  alertmanager.retention: "120h"
  alertmanager.storage.size: "1Gi"
  alertmanager.resources.requests.cpu: "50m"
  alertmanager.resources.requests.memory: "64Mi"
  alertmanager.resources.limits.cpu: "200m"
  alertmanager.resources.limits.memory: "256Mi"
  
  # Grafana Configuration
  grafana.adminPassword: "monitoring"
  grafana.storage.size: "5Gi"
  grafana.resources.requests.cpu: "100m"
  grafana.resources.requests.memory: "256Mi"
  grafana.resources.limits.cpu: "500m"
  grafana.resources.limits.memory: "512Mi"
  
  # Loki Configuration
  loki.retention: "168h"  # 7 days
  loki.storage.size: "20Gi"
  loki.resources.requests.cpu: "100m"
  loki.resources.requests.memory: "256Mi"
  loki.resources.limits.cpu: "1000m"
  loki.resources.limits.memory: "1Gi"
  
  # Fluent Bit Configuration
  fluentbit.resources.requests.cpu: "50m"
  fluentbit.resources.requests.memory: "64Mi"
  fluentbit.resources.limits.cpu: "200m"
  fluentbit.resources.limits.memory: "256Mi"
  
  # Tempo Configuration
  tempo.retention: "24h"
  tempo.storage.size: "10Gi"
  tempo.resources.requests.cpu: "100m"
  tempo.resources.requests.memory: "256Mi"
  tempo.resources.limits.cpu: "1000m"
  tempo.resources.limits.memory: "1Gi"
  
  # OpenTelemetry Collector Configuration
  otel.resources.requests.cpu: "100m"
  otel.resources.requests.memory: "256Mi"
  otel.resources.limits.cpu: "500m"
  otel.resources.limits.memory: "512Mi"