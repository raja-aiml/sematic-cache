apiVersion: v1
kind: ConfigMap
metadata:
  name: load-generator-scripts
data:
  script.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';

    export let options = {
      stages: [
        { duration: '30s', target: 10 },
        { duration: '1m', target: 20 },
        { duration: '30s', target: 0 },
      ],
    };

    export default function() {
      // Test PostgreSQL through app
      let pgResponse = http.get('http://semantic-cache:8080/api/health/postgres');
      check(pgResponse, {
        'PostgreSQL health check status is 200': (r) => r.status === 200,
      });

      // Test Redis through app
      let redisResponse = http.get('http://semantic-cache:8080/api/health/redis');
      check(redisResponse, {
        'Redis health check status is 200': (r) => r.status === 200,
      });

      // Test main API endpoint
      let apiResponse = http.get('http://semantic-cache:8080/api/v1/status');
      check(apiResponse, {
        'API status is 200': (r) => r.status === 200,
      });

      sleep(1);
    }