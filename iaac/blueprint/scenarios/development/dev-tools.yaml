apiVersion: v1
kind: Namespace
metadata:
  name: dev-tools
  labels:
    environment: development
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-toolbox
  namespace: dev-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dev-toolbox
  template:
    metadata:
      labels:
        app: dev-toolbox
    spec:
      containers:
      - name: toolbox
        image: nicolaka/netshoot:latest
        command: ["/bin/bash"]
        args: ["-c", "while true; do sleep 3600; done"]
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 512Mi
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: dev-scripts
          defaultMode: 0755
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dev-scripts
  namespace: dev-tools
data:
  test-connectivity.sh: |
    #!/bin/bash
    echo "Testing connectivity to services..."
    
    # Test PostgreSQL
    echo -n "PostgreSQL: "
    nc -zv postgres.infra 5432 2>&1 | grep -q succeeded && echo "✓ Connected" || echo "✗ Failed"
    
    # Test Redis
    echo -n "Redis: "
    nc -zv redis.infra 6379 2>&1 | grep -q succeeded && echo "✓ Connected" || echo "✗ Failed"
    
    # Test Prometheus
    echo -n "Prometheus: "
    curl -s http://prometheus.monitoring:9090/-/healthy > /dev/null && echo "✓ Healthy" || echo "✗ Unhealthy"
    
    # Test Grafana
    echo -n "Grafana: "
    curl -s http://grafana.monitoring:3000/api/health > /dev/null && echo "✓ Healthy" || echo "✗ Unhealthy"
    
    # Test Loki
    echo -n "Loki: "
    curl -s http://loki.logging:3100/ready > /dev/null && echo "✓ Ready" || echo "✗ Not Ready"
    
    # Test Jaeger
    echo -n "Jaeger: "
    curl -s http://otel-visualizer.tracing:16686/ > /dev/null && echo "✓ Available" || echo "✗ Unavailable"
  
  load-test.sh: |
    #!/bin/bash
    echo "Running load tests..."
    
    # PostgreSQL load test
    echo "PostgreSQL benchmark:"
    pgbench -h postgres.infra -U postgres -d postgres -c 10 -j 2 -t 1000 -P 10
    
    # Redis load test
    echo "Redis benchmark:"
    redis-benchmark -h redis.infra -n 10000 -c 50 -q
  
  debug-network.sh: |
    #!/bin/bash
    echo "Network debugging information:"
    
    echo -e "\n=== DNS Resolution ==="
    nslookup postgres.infra
    nslookup redis.infra
    nslookup prometheus.monitoring
    
    echo -e "\n=== Routing Table ==="
    ip route
    
    echo -e "\n=== Network Interfaces ==="
    ip addr
    
    echo -e "\n=== Active Connections ==="
    ss -tuln
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k9s
  namespace: dev-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k9s
  template:
    metadata:
      labels:
        app: k9s
    spec:
      serviceAccountName: k9s
      containers:
      - name: k9s
        image: quay.io/derailed/k9s:latest
        command: ["/bin/sh"]
        args: ["-c", "while true; do sleep 3600; done"]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k9s
  namespace: dev-tools
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k9s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: k9s
  namespace: dev-tools