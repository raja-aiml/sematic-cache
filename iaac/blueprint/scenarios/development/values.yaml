apiVersion: v1
kind: ConfigMap
metadata:
  name: development-values
data:
  # PostgreSQL Configuration
  postgres.replicas: "1"
  postgres.resources.requests.cpu: "200m"
  postgres.resources.requests.memory: "512Mi"
  postgres.resources.limits.cpu: "1000m"
  postgres.resources.limits.memory: "2Gi"
  postgres.storage.size: "10Gi"
  postgres.maxConnections: "200"
  
  # Redis Configuration
  redis.replicas: "1"
  redis.resources.requests.cpu: "100m"
  redis.resources.requests.memory: "256Mi"
  redis.resources.limits.cpu: "500m"
  redis.resources.limits.memory: "1Gi"
  redis.storage.size: "5Gi"
  redis.maxMemory: "1gb"
  
  # Prometheus Configuration
  prometheus.retention: "30d"
  prometheus.storage.size: "50Gi"
  prometheus.scrapeInterval: "10s"
  
  # Grafana Configuration
  grafana.adminPassword: "development"
  grafana.plugins: "redis-datasource,vertamedia-clickhouse-datasource"
  
  # Loki Configuration
  loki.retention: "720h"
  loki.storage.size: "50Gi"
  
  # OpenTelemetry Configuration
  otel.sampling.percentage: "100"
  otel.debug.enabled: "true"
  
  # General Settings
  debug.enabled: "true"
  profiling.enabled: "true"
  metrics.detailed: "true"