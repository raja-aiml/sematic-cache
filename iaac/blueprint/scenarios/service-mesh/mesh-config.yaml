apiVersion: v1
kind: Namespace
metadata:
  name: service-mesh-demo
  labels:
    istio-injection: enabled
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: demo-gateway
  namespace: service-mesh-demo
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: demo-routes
  namespace: service-mesh-demo
spec:
  hosts:
  - "*"
  gateways:
  - demo-gateway
  http:
  - match:
    - uri:
        prefix: "/postgres"
    route:
    - destination:
        host: postgres.infra.svc.cluster.local
        port:
          number: 5432
  - match:
    - uri:
        prefix: "/redis"
    route:
    - destination:
        host: redis.infra.svc.cluster.local
        port:
          number: 6379
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: postgres-destination
  namespace: infra
spec:
  host: postgres.infra.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 100
        http2MaxRequests: 100
        maxRequestsPerConnection: 2
    loadBalancer:
      simple: LEAST_REQUEST
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: redis-destination
  namespace: infra
spec:
  host: redis.infra.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 50
    loadBalancer:
      simple: ROUND_ROBIN
    outlierDetection:
      consecutiveErrors: 5
      interval: 30s
      baseEjectionTime: 30s
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: service-mesh-demo
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-all
  namespace: service-mesh-demo
spec:
  action: ALLOW
  rules:
  - {}
---
apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: demo-metrics
  namespace: service-mesh-demo
spec:
  metrics:
  - providers:
    - name: prometheus
    overrides:
    - match:
        metric: REQUEST_COUNT
      tagOverrides:
        method:
          operation: REQUEST
    - match:
        metric: REQUEST_DURATION
      tagOverrides:
        method:
          operation: REQUEST
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mesh-demo-app
  namespace: service-mesh-demo
data:
  demo.yaml: |
    # Sample application to demonstrate service mesh features
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: sample-app
    spec:
      replicas: 3
      selector:
        matchLabels:
          app: sample
      template:
        metadata:
          labels:
            app: sample
            version: v1
        spec:
          containers:
          - name: app
            image: kennethreitz/httpbin
            ports:
            - containerPort: 80