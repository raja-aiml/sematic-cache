apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: service-mesh-scenario

resources:
- ../../infra/base
- ../../infra/modules/istio
- ../../infra/modules/observability/prometheus
- ../../infra/modules/observability/grafana
- mesh-config.yaml

patchesStrategicMerge:
- values.yaml

namespace: service-mesh-demo

commonLabels:
  scenario: service-mesh
  mesh: istio