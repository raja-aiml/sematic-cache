# Minimal scenario configuration values

# PostgreSQL configuration
postgres:
  enabled: true
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  storage:
    size: "1Gi"
    storageClass: "local-path"

# Redis configuration  
redis:
  enabled: true
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  storage:
    size: "1Gi"
    storageClass: "local-path"

# Disable optional components
istio:
  enabled: false

monitoring:
  enabled: false

logging:
  enabled: false

tracing:
  enabled: false