apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: minimal-scenario

resources:
  - ../../infra/base/

commonLabels:
  scenario: minimal
  environment: development

patches:
  # Reduce resource requirements for minimal deployment
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 128Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
    target:
      kind: Deployment
      name: postgres
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 64Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 128Mi
    target:
      kind: Deployment
      name: redis
  # Reduce storage requirements
  - patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
    target:
      kind: PersistentVolumeClaim
      name: postgres-pvc
  - patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 500Mi
    target:
      kind: PersistentVolumeClaim
      name: redis-pvc