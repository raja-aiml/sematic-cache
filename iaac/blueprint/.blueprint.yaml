version: "1.0"

metadata:
  name: "semantic-cache-blueprint"
  description: "Blueprint for deploying semantic cache infrastructure"
  version: "1.0.0"
  author: "AIML Team"

paths:
  base: "."
  scenarios: "scenarios"
  infrastructure: "infra"
  application: "app"
  modules: "modules"
  overlays: "overlays"
  validation_kit: "validation-kit"
  scripts: "hack"

scenarios:
  minimal:
    name: "Minimal"
    description: "Basic infrastructure components only"
    components:
      - "base"
    namespaces:
      - "infra"
      - "app"
    validation:
      required_components:
        - "postgres"
        - "redis"
      tests:
        - "smoke"

  development:
    name: "Development"
    description: "Development environment with additional tools"
    components:
      - "base"
      - "dev-tools"
    namespaces:
      - "infra"
      - "app"
      - "dev-tools"
    validation:
      required_components:
        - "postgres"
        - "redis"
        - "pgadmin"
      tests:
        - "smoke"
        - "integration"

  service-mesh:
    name: "Service Mesh"
    description: "Service mesh enabled deployment"
    components:
      - "base"
      - "istio"
    namespaces:
      - "infra"
      - "app"
      - "istio-system"
      - "istio-ingress"
    validation:
      required_components:
        - "postgres"
        - "redis"
        - "istiod"
        - "istio-ingressgateway"
      tests:
        - "smoke"
        - "istio"

  monitoring-only:
    name: "Monitoring Only"
    description: "Monitoring and observability stack"
    components:
      - "base"
      - "observability/monitoring"
      - "observability/logging"
    namespaces:
      - "infra"
      - "app"
      - "monitoring"
      - "logging"
    validation:
      required_components:
        - "postgres"
        - "redis"
        - "prometheus"
        - "grafana"
        - "loki"
      tests:
        - "smoke"
        - "monitoring"

  full-stack:
    name: "Full Stack"
    description: "Complete deployment with all features"
    components:
      - "base"
      - "istio"
      - "observability"
      - "dev-tools"
    namespaces:
      - "infra"
      - "app"
      - "istio-system"
      - "istio-ingress"
      - "monitoring"
      - "logging"
      - "dev-tools"
    validation:
      required_components:
        - "postgres"
        - "redis"
        - "istiod"
        - "prometheus"
        - "grafana"
        - "pgadmin"
      tests:
        - "smoke"
        - "integration"
        - "istio"
        - "monitoring"

modules:
  observability:
    name: "Observability Stack"
    description: "Monitoring, logging, and tracing"
    dependencies:
      - "monitoring"
      - "logging"
      - "tracing"

  istio:
    name: "Istio Service Mesh"
    description: "Service mesh for traffic management and security"
    parameters:
      version: "1.19.0"

  dev-tools:
    name: "Developer Tools"
    description: "Tools for development and debugging"
    dependencies:
      - "pgadmin"
      - "redis-commander"

  security:
    name: "Security Components"
    description: "Additional security components"
    dependencies:
      - "cert-manager"
      - "sealed-secrets"

overlays:
  local:
    name: "Local Development"
    description: "Optimized for local k3d clusters"
    parameters:
      storage_class: "local-path"
      ingress_type: "traefik"

  dev:
    name: "Development Environment"
    description: "Development cluster settings"
    parameters:
      storage_class: "standard"
      ingress_type: "nginx"

  production:
    name: "Production Environment"
    description: "Production-ready settings"
    parameters:
      storage_class: "fast-ssd"
      ingress_type: "nginx"
      enable_backups: "true"

validation:
  required_directories:
    - "scenarios"
    - "infra"
    - "app"
  optional_directories:
    - "validation-kit"
    - "hack"
    - "docs"
  required_files:
    - "kustomization.yaml"
    - "scenarios/minimal/kustomization.yaml"