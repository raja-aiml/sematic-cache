apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: otel-instrumentation
  namespace: tracing
spec:
  exporter:
    endpoint: http://otel-collector:4317
  propagators:
  - tracecontext
  - baggage
  - b3
  sampler:
    type: parentbased_traceidratio
    argument: "0.1"
  python:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:latest
  nodejs:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-nodejs:latest
  java:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:latest
  dotnet:
    image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-dotnet:latest
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-auto-instrumentation
  namespace: tracing
data:
  instrumentation.yaml: |
    # Auto-instrumentation configuration
    # Apply to pods with annotation:
    # instrumentation.opentelemetry.io/inject-python: "true"
    # instrumentation.opentelemetry.io/inject-nodejs: "true"
    # instrumentation.opentelemetry.io/inject-java: "true"
    # instrumentation.opentelemetry.io/inject-dotnet: "true"
    
    # Environment variables injected:
    OTEL_SERVICE_NAME: "${POD_NAME}"
    OTEL_RESOURCE_ATTRIBUTES: "k8s.namespace.name=${POD_NAMESPACE},k8s.pod.name=${POD_NAME},k8s.node.name=${NODE_NAME}"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.tracing:4317"
    OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    OTEL_TRACES_EXPORTER: "otlp"
    OTEL_METRICS_EXPORTER: "otlp"
    OTEL_LOGS_EXPORTER: "otlp"