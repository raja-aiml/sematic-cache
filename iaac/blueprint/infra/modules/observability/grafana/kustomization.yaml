apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- deployment.yaml
- service.yaml
- configmap.yaml
- secret.yaml
- pvc.yaml
- rbac.yaml
- ingress.yaml
- datasources.yaml
- dashboard-provider.yaml

configMapGenerator:
- name: grafana-dashboards
  files:
  - dashboards/istio-mesh.json
  - dashboards/istio-service.json
  - dashboards/istio-workload.json
  - dashboards/istio-control-plane.json
  - dashboards/kubernetes-cluster.json
  - dashboards/prometheus-overview.json
  - dashboards/postgres-dashboard.json
  - dashboards/redis-dashboard.json
  - dashboards/nginx-ingress.json
  - dashboards/otel-traces.json
  - dashboards/application-metrics.json