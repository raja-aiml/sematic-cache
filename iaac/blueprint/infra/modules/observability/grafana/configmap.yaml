apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: monitoring
data:
  grafana.ini: |
    [server]
    protocol = http
    http_port = 3000
    domain = grafana.local
    root_url = %(protocol)s://%(domain)s:%(http_port)s/
    serve_from_sub_path = false

    [database]
    type = sqlite3
    path = grafana.db

    [security]
    admin_user = admin
    admin_password = admin
    disable_gravatar = true
    cookie_secure = false
    cookie_samesite = lax

    [users]
    allow_sign_up = false
    allow_org_create = false
    auto_assign_org = true
    auto_assign_org_role = Viewer

    [auth]
    disable_login_form = false
    disable_signout_menu = false

    [auth.anonymous]
    enabled = true
    org_name = Main Org.
    org_role = Viewer

    [dashboards]
    default_home_dashboard_path = /var/lib/grafana/dashboards/kubernetes-cluster.json

    [alerting]
    enabled = true
    execute_alerts = true

    [explore]
    enabled = true

    [metrics]
    enabled = true
    interval_seconds = 10

    [log]
    mode = console
    level = info

    [dataproxy]
    logging_enabled = false

    [analytics]
    reporting_enabled = false
    check_for_updates = false