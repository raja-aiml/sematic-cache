apiVersion: v1
kind: ConfigMap
metadata:
  name: security-contexts
  namespace: default
data:
  default-security-context.yaml: |
    # Default security context for applications
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 3000
      fsGroup: 2000
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
        - ALL
        add:
        - NET_BIND_SERVICE
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false

  database-security-context.yaml: |
    # Security context for database workloads
    securityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
        - ALL
      allowPrivilegeEscalation: false

  privileged-security-context.yaml: |
    # Security context for system components that need privileges
    securityContext:
      privileged: true
      runAsUser: 0
      capabilities:
        add:
        - SYS_ADMIN
        - NET_ADMIN

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: admission-config
  namespace: kube-system
data:
  admission-configuration.yaml: |
    apiVersion: apiserver.config.k8s.io/v1
    kind: AdmissionConfiguration
    plugins:
    - name: PodSecurity
      configuration:
        apiVersion: pod-security.admission.config.k8s.io/v1
        kind: PodSecurityConfiguration
        defaults:
          enforce: "baseline"
          enforce-version: "latest"
          audit: "restricted"
          audit-version: "latest"
          warn: "restricted"
          warn-version: "latest"
        exemptions:
          usernames: []
          runtimeClasses: []
          namespaces: [kube-system, kube-public, kube-node-lease, istio-system]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: security-policies
  namespace: default
data:
  resource-quotas.yaml: |
    apiVersion: v1
    kind: ResourceQuota
    metadata:
      name: compute-quota
    spec:
      hard:
        requests.cpu: "10"
        requests.memory: 20Gi
        limits.cpu: "20"
        limits.memory: 40Gi
        persistentvolumeclaims: "10"
        pods: "50"

  limit-ranges.yaml: |
    apiVersion: v1
    kind: LimitRange
    metadata:
      name: memory-limit-range
    spec:
      limits:
      - default:
          memory: 512Mi
          cpu: 500m
        defaultRequest:
          memory: 256Mi
          cpu: 100m
        type: Container