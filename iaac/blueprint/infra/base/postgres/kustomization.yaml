apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: postgres-base

namespace: infra

resources:
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - pvc.yaml
  - pdb.yaml
  - hpa.yaml
  - network-policy.yaml
  # - service-monitor.yaml  # Requires Prometheus Operator

labels:
  - pairs:
      app: postgres
      component: database
      part-of: blueprint

commonAnnotations:
  app.kubernetes.io/name: postgres
  app.kubernetes.io/component: database
  app.kubernetes.io/part-of: blueprint