apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: redis-base

namespace: infra

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - pvc.yaml
  - pdb.yaml
  - hpa.yaml
  - network-policy.yaml
  - service-monitor.yaml

commonLabels:
  app: redis
  component: cache
  part-of: blueprint

commonAnnotations:
  app.kubernetes.io/name: redis
  app.kubernetes.io/component: cache
  app.kubernetes.io/part-of: blueprint