apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: blueprint-base

resources:
  - namespaces.yaml
  - network-policies.yaml
  - resource-quotas.yaml
  - postgres/
  - redis/

labels:
  - pairs:
      environment: base
      blueprint: semantic-cache
      version: v1.0.0

commonAnnotations:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: blueprint