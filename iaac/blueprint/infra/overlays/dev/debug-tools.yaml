apiVersion: v1
kind: ConfigMap
metadata:
  name: debug-scripts
  namespace: infra
data:
  test-postgres.sh: |
    #!/bin/bash
    echo "Testing PostgreSQL connection..."
    PGPASSWORD=postgres psql -h postgres -U postgres -d postgres -c "SELECT version();"
    
  test-redis.sh: |
    #!/bin/bash
    echo "Testing Redis connection..."
    redis-cli -h redis ping
    
  load-test.sh: |
    #!/bin/bash
    echo "Running load tests..."
    # PostgreSQL load test
    pgbench -i -h postgres -U postgres postgres
    pgbench -c 10 -j 2 -t 1000 -h postgres -U postgres postgres
    
    # Redis load test
    redis-benchmark -h redis -q -n 10000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: debug-pod
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debug
  template:
    metadata:
      labels:
        app: debug
    spec:
      containers:
      - name: debug
        image: postgres:16-alpine
        command: ["/bin/sh", "-c", "sleep infinity"]
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
      - name: redis-cli
        image: redis:7-alpine
        command: ["/bin/sh", "-c", "sleep infinity"]
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: debug-scripts
          defaultMode: 0755