apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: blueprint-dev

resources:
- ../../base
- debug-tools.yaml
- ../../modules/istio
- ../../modules/observability
- ../../modules/security

labels:
- pairs:
    environment: dev

patches:
- path: namespace-patch.yaml
- path: postgres-patch.yaml
- path: redis-patch.yaml
- path: ingress-patch.yaml
- path: monitoring-patch.yaml

# Development configuration
configMapGenerator:
- name: dev-config
  literals:
  - LOG_LEVEL=debug
  - ENABLE_PROFILING=true
  - ENABLE_METRICS=true
  - ENABLE_TRACING=true

# Enable debug mode for containers
replicas:
- name: postgres
  count: 1
- name: redis
  count: 1
- name: debug-pod
  count: 1