apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: blueprint-local

resources:
  - ../../base

labels:
  - pairs:
      environment: local

# Local development specific configurations
patches:
- path: resource-limits.yaml
- path: storage-patch.yaml
- path: postgres-patch.yaml
- path: redis-patch.yaml

# Fixed replicas for local development
replicas:
- name: postgres
  count: 1
- name: redis
  count: 1