apiVersion: batch/v1
kind: Job
metadata:
  name: alerts-test
  namespace: default
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: test
        image: curlimages/curl:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Testing alerting configuration..."
          
          # Test Alertmanager
          echo "=== Testing Alertmanager ==="
          if curl -s http://alertmanager.monitoring:9093/-/healthy 2>/dev/null | grep -q "OK"; then
            echo "SUCCESS: Alertmanager is healthy"
          else
            echo "WARNING: Alertmanager may not be deployed"
          fi
          
          # Check Prometheus rules
          echo "=== Checking Prometheus rules ==="
          rules_response=$(curl -s http://prometheus.monitoring:9090/api/v1/rules)
          
          if echo "$rules_response" | grep -q "groups"; then
            echo "SUCCESS: Found Prometheus rule groups"
            rule_count=$(echo "$rules_response" | grep -o '"name"' | wc -l)
            echo "Number of rules configured: $rule_count"
          else
            echo "WARNING: No Prometheus rules found"
          fi
          
          # Check for active alerts
          echo "=== Checking active alerts ==="
          alerts_response=$(curl -s http://prometheus.monitoring:9090/api/v1/alerts)
          
          if echo "$alerts_response" | grep -q "alerts"; then
            active_alerts=$(echo "$alerts_response" | grep -o '"state":"firing"' | wc -l)
            pending_alerts=$(echo "$alerts_response" | grep -o '"state":"pending"' | wc -l)
            echo "Active alerts: $active_alerts"
            echo "Pending alerts: $pending_alerts"
          else
            echo "INFO: Could not retrieve alerts"
          fi
          
          # Test alert routing (if Alertmanager is available)
          if curl -s http://alertmanager.monitoring:9093/api/v1/status 2>/dev/null | grep -q "config"; then
            echo "SUCCESS: Alertmanager configuration is loaded"
          else
            echo "INFO: Could not verify Alertmanager configuration"
          fi
          
          echo "Alerting tests completed"