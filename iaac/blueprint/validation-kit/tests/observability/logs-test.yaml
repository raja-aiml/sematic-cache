apiVersion: batch/v1
kind: Job
metadata:
  name: logs-test
  namespace: default
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: test
        image: curlimages/curl:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Testing logging pipeline..."
          
          # Generate test log entry
          echo "TEST_LOG_ENTRY_$(date +%s): This is a test log message"
          
          # Test Loki API
          echo "=== Testing Loki API ==="
          if curl -s http://loki.monitoring:3100/ready | grep -q "ready"; then
            echo "SUCCESS: Loki is ready"
          else
            echo "FAILED: Loki not ready"
            exit 1
          fi
          
          # Query for recent logs
          echo "=== Querying recent logs ==="
          QUERY='{job="fluent-bit"}'
          END_TIME=$(date +%s)000000000
          START_TIME=$((END_TIME - 300000000000))  # 5 minutes ago
          
          response=$(curl -s -G http://loki.monitoring:3100/loki/api/v1/query_range \
            --data-urlencode "query=$QUERY" \
            --data-urlencode "start=$START_TIME" \
            --data-urlencode "end=$END_TIME" \
            --data-urlencode "limit=10")
          
          if echo "$response" | grep -q "streams"; then
            echo "SUCCESS: Found log streams"
            echo "$response" | grep -o '"stream"' | wc -l | xargs echo "Number of streams found:"
          else
            echo "WARNING: No log streams found (logging may not be fully configured)"
          fi
          
          # Test Fluent Bit health
          echo "=== Testing Fluent Bit ==="
          # Fluent Bit runs as DaemonSet, check if it exists
          echo "Fluent Bit status will be checked by kubectl in the cluster"
          
          echo "Logging tests completed"