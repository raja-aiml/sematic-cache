apiVersion: batch/v1
kind: Job
metadata:
  name: monitoring-integration-test
  namespace: default
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: test
        image: curlimages/curl:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Testing monitoring endpoints..."
          
          # Test Prometheus metrics
          echo "Checking Prometheus metrics endpoint..."
          if curl -s http://prometheus.monitoring:9090/-/healthy > /dev/null; then
            echo "SUCCESS: Prometheus is healthy"
          else
            echo "FAILED: Prometheus health check failed"
            exit 1
          fi
          
          # Test Grafana
          echo "Checking Grafana endpoint..."
          if curl -s http://grafana.monitoring:3000/api/health > /dev/null; then
            echo "SUCCESS: Grafana is healthy"
          else
            echo "FAILED: Grafana health check failed"
            exit 1
          fi
          
          # Test Loki
          echo "Checking Loki endpoint..."
          if curl -s http://loki.monitoring:3100/ready > /dev/null; then
            echo "SUCCESS: Loki is ready"
          else
            echo "FAILED: Loki readiness check failed"
            exit 1
          fi
          
          echo "All monitoring tests passed"