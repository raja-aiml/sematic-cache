apiVersion: v1
kind: ServiceAccount
metadata:
  name: istio-test
  namespace: default
---
apiVersion: batch/v1
kind: Job
metadata:
  name: istio-integration-test
  namespace: default
spec:
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: istio-test
      restartPolicy: Never
      containers:
      - name: test
        image: curlimages/curl:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Testing Istio sidecar injection..."
          sleep 10
          
          # Check if Envoy proxy is running
          if curl -s localhost:15000/clusters > /dev/null; then
            echo "SUCCESS: Envoy proxy is running"
          else
            echo "FAILED: Envoy proxy not accessible"
            exit 1
          fi
          
          # Check mTLS
          echo "Testing mTLS communication..."
          curl -s http://postgres:5432 || true
          
          echo "All Istio tests passed"