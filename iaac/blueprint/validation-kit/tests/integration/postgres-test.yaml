apiVersion: v1
kind: Namespace
metadata:
  name: integration-test
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-integration-test
  namespace: integration-test
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: test
        image: postgres:16-alpine
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "=== PostgreSQL Integration Test ==="
          
          # Test 1: Basic connectivity
          echo -n "Test 1 - Basic connectivity: "
          if psql -h postgres.infra -U postgres -c "SELECT 1" > /dev/null 2>&1; then
            echo "PASS"
          else
            echo "FAIL"
            exit 1
          fi
          
          # Test 2: Create database
          echo -n "Test 2 - Create database: "
          if psql -h postgres.infra -U postgres -c "CREATE DATABASE test_db" > /dev/null 2>&1; then
            echo "PASS"
          else
            echo "FAIL"
            exit 1
          fi
          
          # Test 3: Create table
          echo -n "Test 3 - Create table: "
          if psql -h postgres.infra -U postgres -d test_db -c "
            CREATE TABLE test_table (
              id SERIAL PRIMARY KEY,
              name VARCHAR(100),
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
            )" > /dev/null 2>&1; then
            echo "PASS"
          else
            echo "FAIL"
            exit 1
          fi
          
          # Test 4: Insert data
          echo -n "Test 4 - Insert data: "
          if psql -h postgres.infra -U postgres -d test_db -c "
            INSERT INTO test_table (name) VALUES 
            ('test1'), ('test2'), ('test3')" > /dev/null 2>&1; then
            echo "PASS"
          else
            echo "FAIL"
            exit 1
          fi
          
          # Test 5: Query data
          echo -n "Test 5 - Query data: "
          COUNT=$(psql -h postgres.infra -U postgres -d test_db -t -c "SELECT COUNT(*) FROM test_table")
          if [ "$COUNT" -eq 3 ]; then
            echo "PASS"
          else
            echo "FAIL (expected 3, got $COUNT)"
            exit 1
          fi
          
          # Test 6: pgvector extension
          echo -n "Test 6 - pgvector extension: "
          if psql -h postgres.infra -U postgres -d test_db -c "CREATE EXTENSION IF NOT EXISTS vector" > /dev/null 2>&1; then
            echo "PASS"
          else
            echo "SKIP (pgvector not available)"
          fi
          
          # Test 7: Connection pooling
          echo -n "Test 7 - Connection pooling: "
          for i in {1..20}; do
            psql -h postgres.infra -U postgres -c "SELECT 1" > /dev/null 2>&1 &
          done
          wait
          echo "PASS"
          
          # Test 8: Transaction test
          echo -n "Test 8 - Transaction test: "
          psql -h postgres.infra -U postgres -d test_db <<EOF > /dev/null 2>&1
          BEGIN;
          INSERT INTO test_table (name) VALUES ('transaction_test');
          ROLLBACK;
          EOF
          COUNT_AFTER=$(psql -h postgres.infra -U postgres -d test_db -t -c "SELECT COUNT(*) FROM test_table")
          if [ "$COUNT_AFTER" -eq 3 ]; then
            echo "PASS"
          else
            echo "FAIL (rollback didn't work)"
            exit 1
          fi
          
          # Cleanup
          psql -h postgres.infra -U postgres -c "DROP DATABASE test_db" > /dev/null 2>&1
          
          echo "=== All PostgreSQL tests passed! ==="
        env:
        - name: PGPASSWORD
          value: postgres
        - name: POSTGRES_HOST
          value: postgres.infra
        - name: POSTGRES_USER
          value: postgres