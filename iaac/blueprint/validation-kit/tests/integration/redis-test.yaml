apiVersion: batch/v1
kind: Job
metadata:
  name: redis-integration-test
  namespace: integration-test
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: test
        image: redis:7-alpine
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "=== Redis Integration Test ==="
          
          # Test 1: Basic connectivity
          echo -n "Test 1 - Basic connectivity: "
          if redis-cli -h redis.infra ping | grep -q PONG; then
            echo "PASS"
          else
            echo "FAIL"
            exit 1
          fi
          
          # Test 2: Set and get
          echo -n "Test 2 - Set and get: "
          redis-cli -h redis.infra SET test_key "test_value" > /dev/null
          VALUE=$(redis-cli -h redis.infra GET test_key)
          if [ "$VALUE" = "test_value" ]; then
            echo "PASS"
          else
            echo "FAIL"
            exit 1
          fi
          
          # Test 3: Data structures - List
          echo -n "Test 3 - List operations: "
          redis-cli -h redis.infra LPUSH test_list "item1" "item2" "item3" > /dev/null
          LENGTH=$(redis-cli -h redis.infra LLEN test_list)
          if [ "$LENGTH" -eq 3 ]; then
            echo "PASS"
          else
            echo "FAIL"
            exit 1
          fi
          
          # Test 4: Data structures - Set
          echo -n "Test 4 - Set operations: "
          redis-cli -h redis.infra SADD test_set "member1" "member2" "member1" > /dev/null
          COUNT=$(redis-cli -h redis.infra SCARD test_set)
          if [ "$COUNT" -eq 2 ]; then
            echo "PASS"
          else
            echo "FAIL"
            exit 1
          fi
          
          # Test 5: Data structures - Hash
          echo -n "Test 5 - Hash operations: "
          redis-cli -h redis.infra HSET test_hash field1 value1 field2 value2 > /dev/null
          VALUE=$(redis-cli -h redis.infra HGET test_hash field1)
          if [ "$VALUE" = "value1" ]; then
            echo "PASS"
          else
            echo "FAIL"
            exit 1
          fi
          
          # Test 6: Data structures - Sorted Set
          echo -n "Test 6 - Sorted set operations: "
          redis-cli -h redis.infra ZADD test_zset 1 "one" 2 "two" 3 "three" > /dev/null
          FIRST=$(redis-cli -h redis.infra ZRANGE test_zset 0 0)
          if [ "$FIRST" = "one" ]; then
            echo "PASS"
          else
            echo "FAIL"
            exit 1
          fi
          
          # Test 7: Expiration
          echo -n "Test 7 - Key expiration: "
          redis-cli -h redis.infra SETEX expire_test 2 "will_expire" > /dev/null
          sleep 3
          VALUE=$(redis-cli -h redis.infra GET expire_test)
          if [ -z "$VALUE" ]; then
            echo "PASS"
          else
            echo "FAIL"
            exit 1
          fi
          
          # Test 8: Transactions
          echo -n "Test 8 - Transactions: "
          redis-cli -h redis.infra <<EOF > /dev/null
          MULTI
          SET trans_test "value"
          INCR counter_test
          EXEC
          EOF
          VALUE=$(redis-cli -h redis.infra GET trans_test)
          if [ "$VALUE" = "value" ]; then
            echo "PASS"
          else
            echo "FAIL"
            exit 1
          fi
          
          # Test 9: Pub/Sub
          echo -n "Test 9 - Pub/Sub: "
          (redis-cli -h redis.infra SUBSCRIBE test_channel > /tmp/sub.out 2>&1) &
          SUB_PID=$!
          sleep 1
          redis-cli -h redis.infra PUBLISH test_channel "test_message" > /dev/null
          sleep 1
          kill $SUB_PID 2>/dev/null
          if grep -q "test_message" /tmp/sub.out; then
            echo "PASS"
          else
            echo "FAIL"
            exit 1
          fi
          
          # Test 10: Pipeline performance
          echo -n "Test 10 - Pipeline performance: "
          for i in $(seq 1 1000); do
            echo "SET key$i value$i"
          done | redis-cli -h redis.infra --pipe > /dev/null
          COUNT=$(redis-cli -h redis.infra EVAL "return #redis.call('keys', 'key*')" 0)
          if [ "$COUNT" -ge 1000 ]; then
            echo "PASS"
          else
            echo "FAIL"
            exit 1
          fi
          
          # Cleanup
          redis-cli -h redis.infra FLUSHDB > /dev/null
          
          echo "=== All Redis tests passed! ==="