apiVersion: v1
kind: Pod
metadata:
  name: curl-pod
  namespace: default
  labels:
    app: curl-pod
    purpose: testing
spec:
  containers:
  - name: curl
    image: curlimages/curl:latest
    command: ["sleep", "infinity"]
    resources:
      requests:
        memory: "32Mi"
        cpu: "25m"
      limits:
        memory: "64Mi"
        cpu: "50m"