apiVersion: v1
kind: Pod
metadata:
  name: postgres-client
  namespace: default
  labels:
    app: postgres-client
    purpose: testing
spec:
  containers:
  - name: postgres-client
    image: postgres:15-alpine
    command: ["sleep", "infinity"]
    env:
    - name: PGPASSWORD
      valueFrom:
        secretKeyRef:
          name: postgres-secret
          key: password
    - name: PGUSER
      value: postgres
    - name: PGHOST
      value: postgres
    - name: PGDATABASE
      value: semantic_cache
    - name: PGPORT
      value: "5432"
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"