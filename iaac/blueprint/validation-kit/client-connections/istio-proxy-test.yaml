apiVersion: v1
kind: Pod
metadata:
  name: istio-proxy-test
  namespace: default
  labels:
    app: istio-proxy-test
    purpose: testing
    version: v1
  annotations:
    sidecar.istio.io/inject: "true"
spec:
  containers:
  - name: app
    image: kennethreitz/httpbin:latest
    ports:
    - containerPort: 80
      name: http
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: istio-proxy-test
  namespace: default
  labels:
    app: istio-proxy-test
spec:
  selector:
    app: istio-proxy-test
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP