groups:
  - name: semantic_cache_alerts
    interval: 30s
    rules:
      - alert: HighCacheMissRate
        expr: |
          (
            rate(semantic_cache_misses_total[5m]) / 
            (rate(semantic_cache_hits_total[5m]) + rate(semantic_cache_misses_total[5m]))
          ) > 0.3
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "High cache miss rate detected"
          description: "Cache miss rate is {{ $value | humanizePercentage }} which is above threshold of 30%"

      - alert: HighCacheLatency
        expr: |
          histogram_quantile(0.95, rate(semantic_cache_latency_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "High cache latency detected"
          description: "95th percentile latency is {{ $value }}s which is above threshold of 0.5s"

  - name: database_alerts
    interval: 30s
    rules:
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL instance {{ $labels.instance }} is down"

      - alert: PostgreSQLHighConnections
        expr: |
          postgres_connections_active / postgres_connections_max > 0.8
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "PostgreSQL connection pool near capacity"
          description: "PostgreSQL is using {{ $value | humanizePercentage }} of max connections"

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          component: cache
        annotations:
          summary: "Redis is down"
          description: "Redis instance {{ $labels.instance }} is down"

      - alert: RedisHighMemory
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis is using {{ $value | humanizePercentage }} of available memory"

  - name: kubernetes_alerts
    interval: 30s
    rules:
      - alert: PodCrashLooping
        expr: |
          rate(kube_pod_container_status_restarts_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
          description: "Pod has restarted {{ $value }} times in the last 15 minutes"

      - alert: PersistentVolumeSpaceLow
        expr: |
          (
            kubelet_volume_stats_available_bytes / 
            kubelet_volume_stats_capacity_bytes
          ) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PV space is running low"
          description: "PV {{ $labels.persistentvolumeclaim }} has only {{ $value | humanizePercentage }} space left"