apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-traffic-scenarios
  namespace: default
data:
  scenarios.yaml: |
    traffic_scenarios:
      - name: "Normal Traffic Pattern"
        description: "Simulates typical application traffic"
        duration: "5m"
        requests_per_second: 100
        distribution:
          - endpoint: "/api/v1/status"
            weight: 20
          - endpoint: "/api/v1/cache/get"
            weight: 50
          - endpoint: "/api/v1/cache/set"
            weight: 30

      - name: "Cache Heavy Load"
        description: "High cache read traffic"
        duration: "10m"
        requests_per_second: 500
        distribution:
          - endpoint: "/api/v1/cache/get"
            weight: 90
          - endpoint: "/api/v1/cache/set"
            weight: 10

      - name: "Canary Deployment Test"
        description: "Traffic split for canary testing"
        virtual_service:
          name: semantic-cache-canary
          spec:
            http:
              - match:
                - headers:
                    canary:
                      exact: "true"
                route:
                - destination:
                    host: semantic-cache
                    subset: v2
              - route:
                - destination:
                    host: semantic-cache
                    subset: v1
                  weight: 90
                - destination:
                    host: semantic-cache
                    subset: v2
                  weight: 10

      - name: "Circuit Breaker Test"
        description: "Tests circuit breaker behavior"
        destination_rule:
          name: semantic-cache-cb
          spec:
            trafficPolicy:
              connectionPool:
                tcp:
                  maxConnections: 10
                http:
                  http1MaxPendingRequests: 10
                  http2MaxRequests: 20
              outlierDetection:
                consecutiveErrors: 5
                interval: 30s
                baseEjectionTime: 30s
                maxEjectionPercent: 50

      - name: "Retry Policy Test"
        description: "Tests retry behavior on failures"
        virtual_service:
          name: semantic-cache-retry
          spec:
            http:
              - retries:
                  attempts: 3
                  perTryTimeout: 5s
                  retryOn: "5xx,reset,connect-failure,refused-stream"
                timeout: 30s

      - name: "Fault Injection Test"
        description: "Injects faults for testing resilience"
        virtual_service:
          name: semantic-cache-fault
          spec:
            http:
              - fault:
                  delay:
                    percentage:
                      value: 10
                    fixedDelay: 5s
                  abort:
                    percentage:
                      value: 5
                    httpStatus: 503
                route:
                - destination:
                    host: semantic-cache