apiVersion: v1
kind: ConfigMap
metadata:
  name: istio-policy-tests
  namespace: default
data:
  policies.yaml: |
    authorization_policies:
      - name: "Allow GET requests only"
        description: "Restricts access to only GET methods"
        spec:
          apiVersion: security.istio.io/v1beta1
          kind: AuthorizationPolicy
          metadata:
            name: allow-get-only
            namespace: default
          spec:
            selector:
              matchLabels:
                app: semantic-cache
            rules:
            - to:
              - operation:
                  methods: ["GET"]

      - name: "Require JWT Token"
        description: "Requires valid JWT for access"
        spec:
          apiVersion: security.istio.io/v1beta1
          kind: RequestAuthentication
          metadata:
            name: jwt-auth
            namespace: default
          spec:
            selector:
              matchLabels:
                app: semantic-cache
            jwtRules:
            - issuer: "https://example.com"
              jwksUri: "https://example.com/.well-known/jwks.json"

      - name: "Namespace Isolation"
        description: "Allow traffic only from same namespace"
        spec:
          apiVersion: security.istio.io/v1beta1
          kind: AuthorizationPolicy
          metadata:
            name: namespace-isolation
            namespace: default
          spec:
            selector:
              matchLabels:
                app: semantic-cache
            rules:
            - from:
              - source:
                  namespaces: ["default"]

    peer_authentication_policies:
      - name: "Strict mTLS"
        description: "Enforce mutual TLS for all traffic"
        spec:
          apiVersion: security.istio.io/v1beta1
          kind: PeerAuthentication
          metadata:
            name: default
            namespace: default
          spec:
            mtls:
              mode: STRICT

      - name: "Permissive mTLS"
        description: "Allow both plain text and mTLS"
        spec:
          apiVersion: security.istio.io/v1beta1
          kind: PeerAuthentication
          metadata:
            name: permissive
            namespace: default
          spec:
            mtls:
              mode: PERMISSIVE

    rate_limiting:
      - name: "Basic Rate Limit"
        description: "100 requests per minute per source IP"
        spec:
          apiVersion: networking.istio.io/v1beta1
          kind: EnvoyFilter
          metadata:
            name: rate-limit
            namespace: default
          spec:
            configPatches:
            - applyTo: HTTP_FILTER
              match:
                context: SIDECAR_INBOUND
                listener:
                  filterChain:
                    filter:
                      name: "envoy.filters.network.http_connection_manager"
              patch:
                operation: INSERT_BEFORE
                value:
                  name: envoy.filters.http.local_ratelimit
                  typed_config:
                    "@type": type.googleapis.com/udpa.type.v1.TypedStruct
                    type_url: type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                    value:
                      stat_prefix: http_local_rate_limiter
                      token_bucket:
                        max_tokens: 100
                        tokens_per_fill: 100
                        fill_interval: 60s

    test_cases:
      - name: "Test mTLS enforcement"
        steps:
          - "Apply strict mTLS policy"
          - "Send request without client certificate"
          - "Expect: Connection rejected"
          - "Send request with valid client certificate"
          - "Expect: Connection accepted"

      - name: "Test authorization policy"
        steps:
          - "Apply allow-GET-only policy"
          - "Send GET request"
          - "Expect: 200 OK"
          - "Send POST request"
          - "Expect: 403 Forbidden"

      - name: "Test rate limiting"
        steps:
          - "Apply rate limit policy"
          - "Send 100 requests rapidly"
          - "Expect: All succeed"
          - "Send 101st request"
          - "Expect: 429 Too Many Requests"