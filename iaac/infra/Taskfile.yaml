version: '3'

includes:
  build:
    taskfile: ../../devops/Taskfile.build.common.yaml
    dir: '{{.USER_WORKING_DIR}}'

vars:
  BINARY_NAME: semantic-cache-deploy
  BINARY_DIR: bin

tasks:
  default:
    desc: Display help message
    cmds:
      - |
        echo "🏗️  Local Deployment Tool"
        echo "========================="
        echo ""
        echo "Build Commands:"
        echo "  task build         # Build binary"
        echo "  task build:all     # Build for all platforms"
        echo "  task test          # Run tests"
        echo "  task ci            # Run CI pipeline"
        echo ""
        echo "Development Commands:"
        echo "  task dev           # Development workflow"
        echo "  task clean         # Clean artifacts"
        echo ""
        echo "For all tasks: task --list"

  # === BUILD TASKS ===
  build:
    desc: Build the binary
    cmds:
      - task: build:build
        vars:
          BINARY_NAME: '{{.BINARY_NAME}}'
          BINARY_DIR: '{{.BINARY_DIR}}'

  build:all:
    desc: Build for all platforms
    cmds:
      - task: build:build:all
        vars:
          BINARY_NAME: '{{.BINARY_NAME}}'

  # === TEST TASKS ===
  test:
    desc: Run all tests
    cmds:
      - task: build:test

  test:quick:
    desc: Run short tests quickly
    cmds:
      - task: build:test:short

  test:cover:
    desc: Run tests with coverage report
    cmds:
      - task: build:test:coverage

  test:bench:
    desc: Run benchmarks
    cmds:
      - task: build:test:bench

  test:verbose:
    desc: Run tests with detailed output
    cmds:
      - task: build:test
        vars:
          TEST_ARGS: "-v"

  test:pkg:
    desc: Run tests for a specific package
    cmds:
      - task: build:test
        vars:
          PACKAGES: "{{.CLI_ARGS}}"

  test:ci:
    desc: Run tests for CI/CD with JUnit output
    cmds:
      - task: build:test
        vars:
          TEST_ARGS: "-json"

  test:watch:
    desc: Run tests in watch mode (auto-rerun on changes)
    cmds:
      - echo "💡 Watch mode requires external tools like watchexec or entr"
      - echo "💡 Example - watchexec -e go task test:quick"

  test:install-tools:
    desc: Install required test tools (gotestsum, etc.)
    cmds:
      - go install gotest.tools/gotestsum@latest
      - echo "✅ Test tools installed"

  # === CODE QUALITY TASKS ===
  fmt:
    desc: Format code
    cmds:
      - task: build:fmt

  fmt:check:
    desc: Check if code is formatted
    cmds:
      - task: build:fmt:check

  vet:
    desc: Run go vet
    cmds:
      - task: build:vet

  lint:
    desc: Run linter
    cmds:
      - task: build:lint

  check:
    desc: Run all checks
    cmds:
      - task: build:check

  # === DEPENDENCY TASKS ===
  deps:
    desc: Install dependencies
    cmds:
      - task: build:deps

  mod-tidy:
    desc: Tidy go modules
    cmds:
      - task: build:deps:tidy

  mod-download:
    desc: Download go modules
    cmds:
      - task: build:deps

  # === CLEAN TASKS ===
  clean:
    desc: Clean build artifacts
    cmds:
      - task: build:clean

  # === CI/CD TASKS ===
  ci:
    desc: Run CI pipeline
    cmds:
      - task: build:ci
        vars:
          BINARY_NAME: '{{.BINARY_NAME}}'

  release:
    desc: Create release artifacts
    cmds:
      - task: build:release
        vars:
          BINARY_NAME: '{{.BINARY_NAME}}'

  # === DOCKER TASKS ===
  docker:build:
    desc: Build Docker image
    cmds:
      - task: build:docker:build
        vars:
          IMAGE_NAME: '{{.BINARY_NAME}}'

  # === DEVELOPMENT TASKS ===
  dev:
    desc: Run development workflow
    deps: [build]
    cmds:
      - ./{{.BINARY_DIR}}/{{.BINARY_NAME}} workflow full

  dev:up:
    desc: Start development cluster
    deps: [build]
    cmds:
      - ./{{.BINARY_DIR}}/{{.BINARY_NAME}} cluster up

  dev:down:
    desc: Stop development cluster
    cmds:
      - ./{{.BINARY_DIR}}/{{.BINARY_NAME}} cluster down

  dev:logs:
    desc: Show application logs
    cmds:
      - ./{{.BINARY_DIR}}/{{.BINARY_NAME}} dev logs -f

  dev:test:
    desc: Run application tests
    cmds:
      - ./{{.BINARY_DIR}}/{{.BINARY_NAME}} dev test

  # === UTILITY TASKS ===
  run:
    desc: Build and run
    deps: [build]
    cmds:
      - ./{{.BINARY_DIR}}/{{.BINARY_NAME}}

  install:
    desc: Install the binary to GOPATH/bin
    deps: [build]
    cmds:
      - cp {{.BINARY_DIR}}/{{.BINARY_NAME}} $GOPATH/bin/

  info:
    desc: Show build information
    cmds:
      - task: build:info