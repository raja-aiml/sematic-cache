# Example: Custom Blueprint Configuration
# This shows how to create a blueprint with custom structure and naming

version: "1.0"

metadata:
  name: "my-custom-app"
  description: "Custom application with non-standard directory structure"
  version: "2.0.0"
  author: "DevOps Team"

# Custom directory structure - not following the default blueprint layout
paths:
  base: "."
  scenarios: "deploy-configs"        # Instead of "scenarios"
  infrastructure: "platform-base"    # Instead of "infra"  
  application: "microservices"       # Instead of "app"
  modules: "platform-addons"         # Instead of "modules"
  overlays: "environments"           # Instead of "overlays"
  validation_kit: "testing"
  scripts: "automation"

# Custom scenarios with descriptive names
scenarios:
  local-dev:
    name: "Local Development"
    description: "Optimized for local development with minimal resources"
    components:
      - "core-db"
      - "cache" 
      - "dev-utils"
    namespaces:
      - "backend"
      - "frontend"
      - "tools"
    validation:
      required_components:
        - "postgresql"
        - "redis"
        - "mailhog"
      tests:
        - "connectivity"
        - "health"

  qa-testing:
    name: "QA Environment"
    description: "Full QA environment with test data"
    components:
      - "core-db"
      - "cache"
      - "message-queue"
      - "test-data-loader"
    namespaces:
      - "backend"
      - "frontend"
      - "testing"
    validation:
      required_components:
        - "postgresql"
        - "redis"
        - "rabbitmq"
      tests:
        - "smoke"
        - "integration"
        - "api-contracts"

  production-blue:
    name: "Production Blue"
    description: "Blue environment for blue-green deployments"
    components:
      - "core-db"
      - "cache"
      - "message-queue"
      - "monitoring-stack"
      - "security-scanning"
    namespaces:
      - "backend"
      - "frontend"
      - "infrastructure"
      - "security"
    validation:
      required_components:
        - "postgresql"
        - "redis"
        - "rabbitmq"
        - "prometheus"
        - "grafana"
      tests:
        - "smoke"
        - "security"
        - "performance"

# Custom modules with different naming
modules:
  core-db:
    name: "Core Database Stack"
    description: "PostgreSQL with extensions and backups"
    path: "database"
    parameters:
      version: "15"
      enable_pgvector: "true"

  cache:
    name: "Caching Layer"
    description: "Redis cluster with Sentinel"
    path: "redis-stack"
    parameters:
      mode: "cluster"
      replicas: "3"

  message-queue:
    name: "Message Queue"
    description: "RabbitMQ with management UI"
    path: "rabbitmq"
    
  monitoring-stack:
    name: "Full Monitoring"
    description: "Prometheus, Grafana, Loki, Tempo"
    path: "observability"
    dependencies:
      - "prometheus"
      - "grafana"
      - "loki"
      - "tempo"

  dev-utils:
    name: "Developer Utilities"
    description: "Tools for local development"
    dependencies:
      - "pgadmin"
      - "redis-commander"
      - "mailhog"

# Environment-specific overlays
overlays:
  local:
    name: "Local Machine"
    description: "Settings for local development"
    parameters:
      resource_limits: "minimal"
      persistence: "hostpath"
      ingress: "port-forward"

  aws-dev:
    name: "AWS Development"
    description: "AWS EKS development cluster"
    parameters:
      storage_class: "gp2"
      ingress: "alb"
      node_type: "t3.medium"

  aws-prod:
    name: "AWS Production"  
    description: "AWS EKS production cluster"
    parameters:
      storage_class: "io2"
      ingress: "nlb"
      node_type: "m5.xlarge"
      enable_backups: "true"
      enable_dr: "true"

# Custom validation rules
validation:
  required_directories:
    - "deploy-configs"
    - "platform-base"
    - "microservices"
  optional_directories:
    - "testing"
    - "automation"
    - "docs"
  required_files:
    - "kustomization.yaml"
    - "deploy-configs/local-dev/kustomization.yaml"
  custom_rules:
    check_versions: "All images must have explicit version tags"
    check_resources: "All deployments must have resource limits"
    check_probes: "All containers must have health probes"