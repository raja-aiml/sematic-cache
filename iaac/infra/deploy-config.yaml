# Semantic Cache Deploy Configuration
# This file contains production-ready settings for local development

# Debug mode - enables verbose logging
debug: false

# Logging configuration
log_file: "./logs/deploy.log"

# Cluster configuration
cluster:
  name: semantic-cache
  api_port: "6550"
  http_port: "8080:80"
  https_port: "8443:443"
  servers: 1
  agents: 0
  timeout: 5m
  wait_time: 10s
  auto_restart: true
  resource_limits:
    cpu_limit: "2"
    memory_limit: "4Gi"

# Build configuration
build:
  image_name: semantic-cache:local
  dockerfile: Dockerfile
  context: "."
  timeout: 10m
  no_cache: false
  build_args:
    - "GO_VERSION=1.21"
  cache_from:
    - "semantic-cache:latest"
  platform: "linux/amd64"

# Deployment configuration
deploy:
  namespace: app
  timeout: 5m
  wait_for_ready: true
  max_retries: 3
  health_check_path: /health
  labels:
    app: semantic-cache
    environment: local
    managed-by: deploy-tool
  annotations:
    "deployment.kubernetes.io/revision": "1"

# Testing configuration
test:
  enabled: true
  timeout: 2m
  retry_attempts: 3
  retry_delay: 5s
  concurrent_tests: 5
  skip_cleanup: false

# Security configuration
security:
  enable_rbac: true
  enable_psp: false
  secret_rotation: 168h  # 7 days
  audit_logging: true
  network_policies: true
  secret_backend: env    # Options: env, file, vault
  encryption:
    enabled: false
    algorithm: aes256
    key_path: "./secrets/encryption.key"

# Environment-specific overrides (example)
# You can create deploy-config.dev.yaml, deploy-config.prod.yaml, etc.