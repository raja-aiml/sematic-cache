# Docker Compose configuration for local development with PostgreSQL, OpenTelemetry, Jaeger, Prometheus, and Caddy
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: ${COMPOSE_PROJECT_NAME:-semantic}-postgres
    environment:
      POSTGRES_USER: cache_user
      POSTGRES_PASSWORD: cache_pass
      POSTGRES_DB: semantic_cache
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cache_user -d semantic_cache"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cache-net

  semantic-cache:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-semantic}-app
    env_file:
      - ../../.env.app
      - ../../.env
    environment:
      DATABASE_URL: postgresql://cache_user:cache_pass@postgres:5432/semantic_cache?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cache-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.97.0
    container_name: ${COMPOSE_PROJECT_NAME:-semantic}-otel-collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
      - "13133:13133"
      - "55679:55679"
    depends_on:
      jaeger:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cache-net

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: ${COMPOSE_PROJECT_NAME:-semantic}-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
      QUERY_BASE_PATH: /jaeger
    ports:
      - "16686:16686"
      - "14250:14250"
      - "4317"
      - "4318"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet localhost:16686 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cache-net

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: ${COMPOSE_PROJECT_NAME:-semantic}-prometheus
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --web.external-url=http://localhost/prometheus/
      - --web.route-prefix=/prometheus/
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet localhost:9090 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cache-net

  caddy:
    image: caddy:2-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-semantic}-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./observability-demo.html:/srv/observability-demo.html
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      jaeger:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cache-net

volumes:
  postgres_data:
  prometheus_data:
  caddy_data:
  caddy_config:

networks:
  cache-net:
    driver: bridge