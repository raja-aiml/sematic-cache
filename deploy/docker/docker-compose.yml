services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: cache
      POSTGRES_USER: cache
      POSTGRES_PASSWORD: cache
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/db_init.sql:/docker-entrypoint-initdb.d/db_init.sql
    ports:
      - "5432:5432"
    networks:
      - sematic-cache

  redis:
    image: redis:8.0.2
    ports:
      - "6379:6379"
    networks:
      - sematic-cache

  nginx:
    image: nginx:alpine
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./web:/usr/share/nginx/html
    networks:
      - sematic-cache

  app:
    build:
      context: ../..
      dockerfile: deploy/k8s/build/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://cache:cache@postgres:5432/cache?sslmode=disable}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy-key}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-}
    depends_on:
      - postgres
      - redis
    networks:
      - sematic-cache

  # Nginx proxy for path-based routing (matches K8s ingress functionality)
  proxy:
    image: nginx:alpine
    volumes:
      - ./config/proxy/proxy.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      - nginx
      - app
    networks:
      - sematic-cache

volumes:
  pgdata:

networks:
  sematic-cache:
