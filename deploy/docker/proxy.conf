upstream nginx_backend {
    server nginx:80;
}

upstream app_backend {
    server app:8080;
}

server {
    listen 80;
    server_name localhost;
    
    # Route /web/* to nginx service (static content)
    location /web/ {
        proxy_pass http://nginx_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Route /semantic-cache/* to app service (API)
    location /semantic-cache/ {
        proxy_pass http://app_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Remove /semantic-cache prefix when forwarding to app
        rewrite ^/semantic-cache(/.*)$ $1 break;
    }
    
    # Health check for proxy
    location /proxy-health {
        access_log off;
        return 200 "proxy healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Default route - show available endpoints
    location = / {
        return 200 '{"endpoints": ["/web/", "/semantic-cache/health", "/semantic-cache/metrics"], "message": "Semantic Cache Docker Deployment"}';
        add_header Content-Type application/json;
    }
}