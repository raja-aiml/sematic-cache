apiVersion: apps/v1
kind: Deployment
metadata:
  name: sematic-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sematic-cache
  template:
    metadata:
      labels:
        app: sematic-cache
    spec:
      containers:
        - name: sematic-cache
          image: sematic-cache:working
          imagePullPolicy: Never
          command: ["/app/sematic-cache"]
          args: ["-address=:8080"]
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sematic-cache-secrets
                  key: DATABASE_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sematic-cache-secrets
                  key: OPENAI_API_KEY
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5