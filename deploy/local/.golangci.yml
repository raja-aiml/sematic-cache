# GolangCI-Lint Configuration
run:
  timeout: 5m
  tests: true
  skip-dirs:
    - bin
    - vendor
    - .git

linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosimple
    - structcheck
    - varcheck
    - ineffassign
    - deadcode
    - typecheck
    - gosec
    - goconst
    - gocyclo
    - gocognit
    - revive
    - misspell
    - unparam
    - dogsled
    - prealloc
    - exportloopref
    - exhaustive
    - sqlclosecheck
    - nolintlint
    - goimports
    - godot
    - whitespace
    - wsl
    - unconvert
    - durationcheck
    - forbidigo
    - forcetypeassert
    - nilerr
    - wastedassign

  disable:
    - gomnd
    - lll
    - gochecknoglobals
    - gochecknoinits
    - goerr113
    - wrapcheck
    - exhaustivestruct
    - testpackage
    - nlreturn
    - gofumpt
    - goheader
    - tparallel
    - paralleltest

linters-settings:
  gofmt:
    simplify: true
  
  govet:
    check-shadowing: true
    enable-all: true
  
  revive:
    rules:
      - name: package-comments
        disabled: true
      - name: exported
        arguments:
          - disableStutteringCheck
  
  gosec:
    excludes:
      - G204 # Subprocess launched with variable
      - G304 # Potential file inclusion via variable
  
  goconst:
    min-len: 3
    min-occurrences: 3
  
  gocyclo:
    min-complexity: 15
  
  gocognit:
    min-complexity: 20
  
  misspell:
    locale: US
  
  unparam:
    check-exported: false
  
  prealloc:
    simple: true
    range-loops: true
    for-loops: true
  
  errcheck:
    check-type-assertions: true
    check-blank: true

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gosec
        - dupl
        - goconst
    
    # Exclude known issues in vendor
    - path: vendor/
      linters:
        - typecheck
        - unused
        - deadcode