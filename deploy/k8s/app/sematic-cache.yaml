apiVersion: apps/v1
kind: Deployment
metadata:
  name: sematic-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sematic-cache
  template:
    metadata:
      labels:
        app: sematic-cache
    spec:
      containers:
        - name: sematic-cache
          image: sematic-cache:working
          imagePullPolicy: Never
          command: ["/app/sematic-cache"]
          args: ["-address=:8080"]
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sematic-cache-secrets
                  key: DATABASE_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sematic-cache-secrets
                  key: OPENAI_API_KEY
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sematic-cache
spec:
  type: LoadBalancer
  selector:
    app: sematic-cache
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sematic-cache-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: sematic.127.0.0.1.nip.io
      http:
        paths:
          - path: /(.*)
            pathType: Prefix
            backend:
              service:
                name: sematic-cache
                port:
                  number: 8080