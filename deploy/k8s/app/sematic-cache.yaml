apiVersion: apps/v1
kind: Deployment
metadata:
  name: sematic-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sematic-cache
  template:
    metadata:
      labels:
        app: sematic-cache
    spec:
      containers:
        - name: sematic-cache
          image: sematic-cache:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: postgres://cache:cache@postgres.infra:5432/cache?sslmode=disable
            - name: OPENAI_API_KEY
              value: dummy-key
          ports:
            - containerPort: 8080
          args:
            - "-address=:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: sematic-cache
spec:
  type: LoadBalancer
  selector:
    app: sematic-cache
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sematic-cache-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - host: sematic.localhost
      http:
        paths:
          - path: /(.*)
            pathType: Prefix
            backend:
              service:
                name: sematic-cache
                port:
                  number: 8080