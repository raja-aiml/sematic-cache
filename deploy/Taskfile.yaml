version: '3'

# =====================================
# 🚀 SEMANTIC CACHE DEPLOYMENT TASKS
# =====================================

includes:
  deploy:
    taskfile: ../devops/Taskfile.deploy.common.yaml
    dir: '{{.USER_WORKING_DIR}}'

vars:
  CLUSTER_NAME: sematic-cache
  WORKFLOW_SCRIPT: ./workflow.sh
  API_URL: http://localhost:8080/semantic-cache
  WEB_URL: http://localhost:8080/web

env:
  FORCE_COLOR: true

tasks:
  # === HELP & INFO ===
  default:
    desc: Show available tasks
    cmds:
      - |
        echo "🚀 Semantic Cache Deployment Tasks"
        echo "===================================="
        echo ""
        'echo "Quick Start:"'
        echo "  task full          # Complete end-to-end workflow"
        echo "  task quick         # Quick development workflow"
        echo "  task status        # Check deployment status"
        echo "  task reset         # Reset and redeploy everything"
        echo ""
        'echo "For detailed help: task --list"'
    silent: true

  # === CORE WORKFLOWS ===
  full:
    desc: Complete production workflow (setup → build → deploy → test)
    cmds:
      - task: deploy:full

  quick:
    desc: Quick development workflow with essential tests only
    cmds:
      - task: deploy:quick

  reset:
    desc: Complete reset (cleanup → setup → build → deploy)
    cmds:
      - task: deploy:reset

  # === INDIVIDUAL STEPS ===
  setup:
    desc: Create k3d cluster and deploy infrastructure
    cmds:
      - task: deploy:setup

  build:
    desc: Build Docker image and import to cluster
    cmds:
      - echo "🔨 Building application..."
      - "{{.WORKFLOW_SCRIPT}} build"

  deploy:
    desc: Deploy application to cluster
    cmds:
      - task: deploy:deploy

  test:
    desc: Run comprehensive end-to-end tests
    cmds:
      - task: deploy:test

  test:quick:
    desc: Run essential tests only (faster)
    cmds:
      - task: deploy:test:quick

  # === MONITORING & MAINTENANCE ===
  status:
    desc: Show current deployment status
    cmds:
      - task: deploy:status

  logs:
    desc: Show application logs
    cmds:
      - task: deploy:logs

  health:
    desc: Quick health check of all services
    cmds:
      - task: deploy:health

  metrics:
    desc: Show API metrics
    cmds:
      - task: deploy:metrics

  # === API TESTING ===
  api:test:
    desc: Test API endpoints with sample data
    cmds:
      - task: deploy:test:api

  api:benchmark:
    desc: Run API performance benchmark
    cmds:
      - task: deploy:test:benchmark

  # === CLUSTER MANAGEMENT ===
  cluster:info:
    desc: Show cluster information
    cmds:
      - task: deploy:cluster:info

  cluster:events:
    desc: Show recent cluster events
    cmds:
      - task: deploy:cluster:events

  # === CLEANUP ===
  cleanup:
    desc: Destroy cluster and cleanup all resources
    cmds:
      - task: deploy:cleanup

  clean:
    desc: Alias for cleanup
    cmds:
      - task: cleanup

  # === DEVELOPMENT HELPERS ===
  dev:
    desc: Development cycle (build → deploy → quick-test)
    cmds:
      - task: deploy:dev

  redeploy:
    desc: Quick redeploy (build → deploy)
    cmds:
      - task: deploy:redeploy

  # === VERIFICATION ===
  verify:
    desc: Verify deployment is working correctly
    cmds:
      - task: deploy:verify

  validate:
    desc: Validate configuration files
    cmds:
      - task: deploy:validate

  # === TESTING SUITES ===
  test:infrastructure:
    desc: Test infrastructure components only
    cmds:
      - echo "🏗️  Testing infrastructure..."
      - ./tests/e2e.sh infrastructure

  test:application:
    desc: Test application components only
    cmds:
      - echo "🚀 Testing application..."
      - ./tests/e2e.sh application

  test:api:
    desc: Test API endpoints only
    cmds:
      - echo "🔬 Testing API..."
      - ./tests/e2e.sh api

  test:performance:
    desc: Test performance and load handling
    cmds:
      - echo "⚡ Testing performance..."
      - ./tests/e2e.sh performance

  test:monitoring:
    desc: Test logging and observability
    cmds:
      - echo "📊 Testing monitoring..."
      - ./tests/e2e.sh monitoring

  # === ADVANCED OPERATIONS ===
  scale:up:
    desc: Scale application to 2 replicas
    cmds:
      - task: deploy:scale:up

  scale:down:
    desc: Scale application to 1 replica
    cmds:
      - task: deploy:scale:down

  restart:
    desc: Restart application deployment
    cmds:
      - task: deploy:restart

  # === PORT FORWARDING ===
  port-forward:api:
    desc: Port forward to API service (localhost:8080)
    cmds:
      - task: deploy:port-forward:api

  port-forward:postgres:
    desc: Port forward to PostgreSQL (localhost:5432)
    cmds:
      - task: deploy:port-forward:postgres

  port-forward:redis:
    desc: Port forward to Redis (localhost:6379)
    cmds:
      - task: deploy:port-forward:redis

  # === DEBUGGING ===
  debug:
    desc: Debug deployment issues
    cmds:
      - task: deploy:debug

  debug:pods:
    desc: Debug pod issues
    cmds:
      - task: deploy:debug:pods

  debug:network:
    desc: Debug network connectivity issues
    cmds:
      - task: deploy:debug:network

  # === RESOURCE MANAGEMENT ===
  resources:
    desc: Show resource usage across cluster
    cmds:
      - task: deploy:resources

  describe:api:
    desc: Describe API deployment and pods
    cmds:
      - 'echo "📋 API Deployment Details:"'
      - kubectl describe deployment sematic-cache -n app
      - echo ""
      - 'echo "📋 API Pod Details:"'
      - kubectl describe pods -l app=sematic-cache -n app

  # === CI/CD HELPERS ===
  ci:test:
    desc: Run CI-friendly tests (no interactive prompts)
    cmds:
      - task: deploy:ci:test

  ci:validate:
    desc: Validate all configurations for CI
    cmds:
      - task: deploy:ci:validate

  # === WORKFLOW COMBINATIONS ===
  quick-start:
    desc: Quick start for new deployments
    deps: [setup, build, deploy]
    cmds:
      - echo "🎉 Quick start completed!"
      - task: verify

  full-cycle:
    desc: Complete development cycle with verification
    deps: [build, deploy, test:quick]
    cmds:
      - echo "🎉 Full development cycle completed!"
      - task: status

  production-ready:
    desc: Full production readiness validation
    deps: [setup, build, deploy, test, verify]
    cmds:
      - echo "🎉 Production readiness validation completed!"
      - echo "🚀 Deployment is production-ready!"

  # === MAINTENANCE ===
  update:images:
    desc: Update application images
    cmds:
      - echo "🔄 Updating application images..."
      - task: build
      - task: restart
      - echo "✅ Images updated successfully!"

  backup:config:
    desc: Backup current configuration
    cmds:
      - echo "💾 Backing up configuration..."
      - mkdir -p backups/$(date +%Y%m%d-%H%M%S)
      - kubectl get all -A -o yaml > backups/$(date +%Y%m%d-%H%M%S)/all-resources.yaml
      - echo "✅ Configuration backed up to backups/ directory"

  # === WATCH OPERATIONS ===
  watch:pods:
    desc: Watch pod status in real-time
    cmds:
      - echo "👀 Watching pods..."
      - watch kubectl get pods -A

  watch:logs:
    desc: Watch application logs in real-time
    cmds:
      - echo "📜 Watching logs..."
      - kubectl logs -n app -l app=sematic-cache -f

  # === DOCUMENTATION ===
  docs:
    desc: Show deployment documentation
    cmds:
      - 'echo "📚 Deployment Documentation:"'
      - 'echo "Main README: ../README.md"'
      - 'echo "Deploy README: ./README.md"'
      - 'echo "Test README: ./tests/README.md"'
      - echo ""
      - 'echo "Quick reference:"'
      - 'echo "  Cluster: {{.CLUSTER_NAME}}"'
      - 'echo "  API: {{.API_URL}}/"'
      - 'echo "  Web: {{.WEB_URL}}/"'
      - 'echo "  Logs: task logs"'
      - 'echo "  Status: task status"'